# Installed by `tools/deploy.py install material`; loaded through printer.cfg's
# [include wm_material*.cfg]. Remove (`deploy.py uninstall material`) and the
# unload macros fall back to temperature-based material detection.
[wm_material]
ini_path: ~/printer_data/config/tmt1.ini

# Standalone load distances in mm of filament: feed to nozzle, then flush.
# load_feed_mm: 55
# load_purge_mm: 50
# Purge for different material families, mixed families, or unknown nozzle residue.
# Replaces (does not add to) load_purge_mm; defaults to that setting when omitted.
# Finish variants such as PLA/PLA Matte share a family; PETG/PCTG remain distinct.
# cross_material_purge_mm: 50
