[gcode_macro EXTRUDE_FILAMENT]
variable_extrude_length:100
gcode:
    {% set T = params.T|default(0)|int %}
    {% if printer[printer.toolhead.extruder].temperature < printer.configfile.settings.extruder.min_extrude_temp %} 
        M109 S220 T{T}
    {% endif %}
    M400
    M106 S0
    G90
    G1 X-13 Y80 F6000  ; 移动到安全位置  ; 移动到安全位置
    M83
    G92 E0 
    G91
    # G1 Z-6 F2000.0
    G1 E{extrude_length} F400
    G90
    M106 S255
    M400
    M109 S160 T{T}
    M106 S0
    M400
    WIPE_NOZZLE
    PARK_CURRENT_TOOL


[gcode_macro RETRACT_FILAMENT]
gcode:
    G90
    G1 X-13 Y232 F6000
    M83
    G92 E0 
    G91
    G1 E3 F600
    G1 E-20 F3500   
    G4 P5000       
    G1 E10 F1000  
    G1 E-50 F1000
    G90
    M400

[gcode_macro LOAD_FILAMENT]
variable_extrude_length:100
gcode:
    {% set T  = params.T|default(0)|int %}
    {% if T == 0 %}
        ACTIVATE_EXTRUDER EXTRUDER=extruder
    {% else %}
        ACTIVATE_EXTRUDER EXTRUDER=extruder{T}
    {% endif %}
    M109 S220 T{T}
    M83
    G92 E0 
    G91
    G1 E{extrude_length} F400
    G90
    M400
    M104 S0 T{T}
    SET_STEPPER_ENABLE STEPPER={printer.toolhead.extruder} ENABLE=0 

[gcode_macro UNLOAD_FILAMENT]
variable_extrude_length:2
variable_retract_length:45
gcode:
    {% set T = params.T|default(0)|int %}
    {% if T == 0 %}
        ACTIVATE_EXTRUDER EXTRUDER=extruder
    {% else %}
        ACTIVATE_EXTRUDER EXTRUDER=extruder{T}
    {% endif %}
    M109 S220 T{T}
    M83
    G92 E0 
    G91
    G1 E{extrude_length} F400
    G1 E-{retract_length} F600
    G90
    M400
    M104 S0 T{T}
    SET_STEPPER_ENABLE STEPPER={printer.toolhead.extruder} ENABLE=0

[gcode_macro M221]
rename_existing:M99221
gcode:
    M99221 S{params.S|int} 
    {% if params.T is defined %}
        SAVE_VARIABLE VARIABLE=t{params.T|int}_flow_extruder VALUE={params.S|int}
    {% endif %}

[gcode_macro RESET_FLOW_EXTRUDER]
description: 恢复设置挤出机流量百分比
gcode:
    {% set thr_number = printer.save_variables.variables.thr_number|int %}
    {% for i in range(thr_number) %}
        M221 S100 T{i}
    {% endfor %}

