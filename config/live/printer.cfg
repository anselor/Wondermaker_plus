[gcode_macro z_rise]
gcode:
    # >>> wondermaker+ begin: real-z-before-xy
    # SET_KINEMATIC_POSITION only labels a position; it cannot establish Z.
    {% if not printer.wmp_recovery.z_reference_valid %}
        _WMP_HOME_Z_BOTTOM
    {% elif printer.toolhead.position.z < 3 and printer.query_endstops.last_query.z==0 %}
        G91
        G1 Z3 F1200
        G90
    {% endif %}
    # <<< wondermaker+ end: real-z-before-xy

[homing_override]
axes: xyz
gcode:
    # A failed dock/release can leave the carriage mechanically constrained.
    {% if printer.save_variables.variables.fail_flag|default(0)|int == -3 %}
        { action_raise_error('Docking failure remains unresolved: saved fail_flag=-3. Inspect the head before homing.') }
    {% endif %}
    # >>> wondermaker+ begin: recovery-bottom-z-order
    {% set recovery_home = params.X is undefined and params.Y is undefined and params.Z is undefined and printer['gcode_macro Z_HOMING'].z_raise|int == 0 %}
    {% if recovery_home %}
        _WMP_RECOVERY_BEGIN
        # Early T normally established Z already. Also support recovery G28
        # with no earlier pickup, without trusting a synthetic homed-axis flag.
        {% if not printer.wmp_recovery.z_reference_valid %}
            _WMP_HOME_Z_BOTTOM
        {% endif %}
        {% if 'y' not in printer.toolhead.homed_axes or 'x' not in printer.toolhead.homed_axes %}
            _WMP_HOME_XY
        {% endif %}
        # No Z_HOMING: no probe-tool pickup, center move or LEVELING pulse.
        _WMP_RECOVERY_RESTORE_MESH
        _OFFSET_SET
        SET_GCODE_VARIABLE MACRO=Z_HOMING VARIABLE=z_raise VALUE=1
        G90
    {% else %}
    # <<< wondermaker+ end: recovery-bottom-z-order
        {% if params.X is undefined and params.Y is undefined and params.Z is undefined %}
            _WMP_SELECT_HOME_TOOL{% if params.P is defined %} PROBE_TOOL={params.P}{% endif %}
        {% endif %}
        QUERY_ENDSTOPS
        # Explicit XY homing must never move or re-reference Z.
        {% if not (params.X is defined and params.Y is defined and params.Z is undefined) %}
            z_rise
        {% endif %}

        # Native XY homing preserves the incoming mode. Explicit Z and
        # full-home positioning must not inherit z_rise's relative mode.
        G90
        {% set current_extruder = printer.save_variables.variables.current_extruder %}
        {% if current_extruder == 99 %}
            SAVE_VARIABLE VARIABLE=unlock_hall VALUE={printer.custom_hall.Raw}
        {% endif %}

        {% set targe_temprature = printer.extruder.target %}

        {% if params.X is defined and params.Y is undefined and params.Z is undefined %} #X
            G28 X
        {% endif %}

        {% if params.Y is defined and params.X is undefined and params.Z is undefined %} #Y
            _WMP_HOME_XY
        {% endif %}

        {% if params.X is undefined and params.Y is undefined and params.Z is defined %} #Z
            {% if 'wmp_recovery' in printer %}
                _WMP_OPERATION_STOP_POINT PHASE=before_z_homing
            {% endif %}
            _LEVELING_TRIGGER_S
            M400
            STEPPER_DIAG_ENABLE CHIP="stepper_z"
            M118 Z-axis is homing
            G28 Z
            G1 Z7 F9600
            STEPPER_DIAG_DISABLE  CHIP="stepper_z"
            SET_GCODE_VARIABLE MACRO=Z_HOMING VARIABLE=z_raise VALUE=1
        {% endif %}

        {% if params.X is defined and params.Y is defined and params.Z is undefined %} #XY
            _WMP_HOME_XY
        {% endif %}

        {% if params.X is undefined and params.Y is undefined and params.Z is undefined %} #XYZ
            _WMP_HOME_XY
            M400
            {% if 'wmp_recovery' in printer %}
                _WMP_OPERATION_STOP_POINT PHASE=before_z_homing
            {% endif %}
            Z_HOMING
        {% endif %}
        G90
    # >>> wondermaker+ begin: recovery-bottom-z-order-end
    {% endif %}
    # <<< wondermaker+ end: recovery-bottom-z-order-end


# Drain before inspecting a carriage which may still touch a dock magnet.
[gcode_macro _WMP_SELECT_HOME_TOOL]
gcode:
    {% if params.PROBE_TOOL is defined and params.PROBE_TOOL|string not in ['0', '1', '2', '3'] %}
        { action_raise_error('Invalid physical probe head: PROBE_TOOL must be one of 0,1,2,3.') }
    {% endif %}
    M400
    _WMP_HOME_DOCK_CLEARANCE
    _WMP_SELECT_HOME_TOOL_SETTLED{% if params.PROBE_TOOL is defined %} PROBE_TOOL={params.PROBE_TOOL}{% endif %}

# Only a supported, unlocked, already-referenced dock position may retreat.
# No inferred attachment, actuator stroke, X/Z move, or synthetic reference.
[gcode_macro _WMP_HOME_DOCK_CLEARANCE]
gcode:
    {% set sv = printer.save_variables.variables %}
    {% set raw = printer.custom_hall.Raw|float %}
    {% set locked = printer['filament_switch_sensor sensor_b'].filament_detected %}
    {% set docks = namespace(all_present=True, matches=0) %}
    {% for i in range(4) %}
        {% if not printer['filament_switch_sensor docked%d' % i].filament_detected %}
            {% set docks.all_present = False %}
        {% endif %}
    {% endfor %}
    {% if sv.fail_flag|default(0)|int == 0 and sv.current_extruder|default(-1)|int == 99
          and not locked and docks.all_present and 3450 <= raw <= 6000
          and 'x' in printer.toolhead.homed_axes and 'y' in printer.toolhead.homed_axes %}
        {% set x = printer.toolhead.position.x|float %}
        {% set y = printer.toolhead.position.y|float %}
        {% for i in range(4) %}
            {% set dock = sv['t%d_position' % i]|default([]) %}
            {% if dock is sequence and dock|length == 2
                  and dock[0] is number and dock[1] is number
                  and 325 <= dock[1] <= 350 and (x - dock[0])|abs <= 1
                  and (y - dock[1])|abs <= 1 and 310 < y <= 350 %}
                {% set docks.matches = docks.matches + 1 %}
            {% endif %}
        {% endfor %}
        {% if docks.matches == 1 %}
            {% set speed_factor = printer.gcode_move.speed_factor|float %}
            {% if not (0 < speed_factor <= 10) %}
                { action_raise_error('Cannot clear home dock: invalid speed override.') }
            {% endif %}
            # Express physical Y310 in the current G-code frame. Restore the
            # caller's mode/feed without replaying its old position afterwards.
            {% set target_y = printer.gcode_move.gcode_position.y|float + 310 - y %}
            SAVE_GCODE_STATE NAME=wmp_home_dock_clearance
            G90
            G1 Y{target_y} F{3000 / speed_factor}
            M400
            G4 P100
            M400
            RESTORE_GCODE_STATE NAME=wmp_home_dock_clearance MOVE=0
        {% endif %}
    {% endif %}

# Fresh render after clearance and settling; retains strict sensor agreement.
[gcode_macro _WMP_SELECT_HOME_TOOL_SETTLED]
gcode:
    {% set sv = printer.save_variables.variables %}
    {% set raw = printer.custom_hall.Raw|float %}
    {% set locked = printer['filament_switch_sensor sensor_b'].filament_detected %}
    {% set docks = namespace(missing=[]) %}
    {% for i in range(4) %}
        {% if not printer['filament_switch_sensor docked%d' % i].filament_detected %}
            {% set docks.missing = docks.missing + [i] %}
        {% endif %}
    {% endfor %}
    {% if sv.fail_flag|default(0)|int != 0 %}
        { action_raise_error('Resolve the toolhead fault before homing: saved fail_flag=%d; expected 0.' % (sv.fail_flag|default(0)|int)) }
    {% endif %}
    {% if raw >= 3450 and raw < 4700 and locked and docks.missing|length == 1 %}
        {% set mounted = docks.missing[0] %}
    {% elif raw >= 4700 and raw <= 6000 and not locked and docks.missing|length == 0 %}
        {% set mounted = 99 %}
    {% else %}
        { action_raise_error('Head attachment sensors disagree: hall=%.1f, sensor_b=%s, empty docks=%s. Expected attached: 3450<=hall<4700, sensor_b=True, one empty dock; detached: hall 4700..6000, sensor_b=False, no empty docks.' % (raw, locked, docks.missing)) }
    {% endif %}
    # Startup explicitly requests its first physical tool. A running/paused
    # print keeps its established datum. Ordinary homing keeps the mounted head.
    {% if params.PROBE_TOOL is defined %}
        {% if params.PROBE_TOOL|string not in ['0', '1', '2', '3'] %}
            { action_raise_error('Invalid physical probe head: PROBE_TOOL must be one of 0,1,2,3.') }
        {% endif %}
        {% set reference = params.PROBE_TOOL|int %}
    {% elif printer.print_stats.state not in ['printing', 'paused'] and mounted != 99 %}
        {% set reference = mounted %}
    {% else %}
        {% set reference = sv.probe_tool|default(0)|int %}
    {% endif %}
    {% if reference < 0 or reference > 3 %}
        { action_raise_error('Invalid physical probe head: saved probe_tool=%d; expected 0..3.' % reference) }
    {% endif %}
    SAVE_VARIABLE VARIABLE=current_extruder VALUE={mounted}
    SAVE_VARIABLE VARIABLE=probe_tool VALUE={reference}

[gcode_macro Z_HOMING]
variable_z_raise: 1
gcode:
    {% if 'wmp_recovery' in printer %}
        _WMP_OPERATION_STOP_POINT PHASE=before_z_positioning
    {% endif %}
    {% set printer_state = printer.print_stats.state %}
    # z_rise leaves relative mode; same-head selection need not change it.
    # All positioning in this routine uses absolute machine coordinates.
    G90
    BED_MESH_CLEAR
    SET_GCODE_OFFSET X=0.0 Y=0.0 Z=0.0 MOVE=1

    SET_GCODE_VARIABLE MACRO=_CHANGE_TOOL VARIABLE=save_position VALUE=0
    # >>> wondermaker+ begin: probe-with-initial-tool (ours, 2026-08-30)
    # The full homing selector sets the physical reference: mounted head for
    # ordinary homing, explicit first tool for START_PRINT.
    {% set probe_tool = printer.save_variables.variables.probe_tool|default(0)|int %}
    # probe_tool is physical, including zero. Recovery restores the slicer's
    # mapping before G28, so logical T0 need not mean physical tool zero.
    _CHANGE_TOOL T={probe_tool}
    # <<< wondermaker+ end: probe-with-initial-tool (stock: T0)

    {% if printer_state == "printing" or printer_state == "paused" %}
        M118 Nozzle is cleaning
        WIPE_NOZZLE
    {% endif %}
    # >>> wondermaker+ begin: homing-center-travel
    # Free XY travel uses the shared configurable general rate.
    _WMP_XY_TRAVEL X=150 Y=135
    # <<< wondermaker+ end: homing-center-travel
    _LEVELING_TRIGGER_S
    M400
    STEPPER_DIAG_ENABLE CHIP="stepper_z"
    M118 Z-axis is homing
    G28 Z
    {% if z_raise == 1 %}
        G1 Z7 F9600
    {% endif %}
    STEPPER_DIAG_DISABLE CHIP="stepper_z"
    SET_GCODE_VARIABLE MACRO=Z_HOMING VARIABLE=z_raise VALUE=1



