[input_shaper]
        
[respond]
default_type: echo
default_prefix: echo:

[printer]
kinematics: corexy
max_velocity: 600
# >>> wondermaker+ begin: accel-cap (original tuning, re-applied on 1.1.04 2026-08-19)
# Why: stock 20000 far exceeds what any input shaper on this machine can
# suppress (measured ceilings ~2600-4400 mm/s^2); at 20k every corner rings.
# See resonance/2026-08-15 measurements and utils/resonance.py.
max_accel: 5000
# <<< wondermaker+ end: accel-cap (stock value: 20000)
max_z_velocity: 30
max_z_accel: 500
square_corner_velocity: 5.0


[virtual_sdcard]
path: ~/printer_data/gcodes

[pause_resume]
recover_velocity: 50.0 

[idle_timeout]
timeout: 600
gcode:
    M118 Idle timeout, all heaters off
    {% set thr_number = printer.save_variables.variables.thr_number|int %}
    {% for i in range(thr_number) %}
        {% if i == 0 %}
            SET_HEATER_TEMPERATURE HEATER=extruder TARGET=0
        {% else %}
            SET_HEATER_TEMPERATURE HEATER=extruder{i} TARGET=0
        {% endif %}
    {% endfor %}


[force_move]
enable_force_move : true
    
[display_status]
  
[gcode_arcs]
resolution: 1.0

[exclude_object]

# >>> wondermaker+ begin: rehome-escape (original, re-applied on 1.1.04 2026-08-19)
# Why: a manual "force a real XY re-home" command, handy after any event that
# leaves the frame doubtful. On 1.1.04 the resume path no longer force-homes
# (binary-verified), so the paused-state homing GATE we used on 1.0.71 was
# intentionally NOT re-applied — this convenience macro is kept on its own.
[gcode_macro REHOME]
description: Home X and Y again, including when already homed
gcode:
    G28 X Y
    M118 REHOME: X and Y homed again
# <<< wondermaker+ end: rehome-escape

# ------------------------------------------------------------------
# The SAVE_CONFIG block is intentionally NOT in this repo: it holds
# per-machine calibration (bed mesh, input shaper, probe offsets).
# utils/config_sync.py preserves the printer's own SAVE_CONFIG block
# when pushing this file.
# ------------------------------------------------------------------
