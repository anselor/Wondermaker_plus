[gcode_macro UNLOCK]
gcode:
    ECHELON_STEPPER_HOMING STEPPER=trans_stepper MOVE=150 SPEED=100 PDI=0   
    ECHELON_STEPPER_DISABLE STEPPER=trans_stepper                    #解锁电机
    M400

[gcode_macro _UNLOCK_TOOL]
gcode:
    {% set fail_flag = printer.save_variables.variables.fail_flag %}
    {% if fail_flag == 0 %}
        {% set current_extruder = params.T|int %}
        {% if current_extruder != 99 %}
            {% set positions = [
                printer.save_variables.variables.t0_position,
                printer.save_variables.variables.t1_position,
                printer.save_variables.variables.t2_position,
                printer.save_variables.variables.t3_position
            ] %}
            {% if 0 <= current_extruder <= 3 %}
                {% set position_x, position_y = positions[current_extruder] %}
            {% endif %}

            # xy回零判断
            {% if "xy" not in printer.toolhead.homed_axes %}
                G28 X Y
            {% endif %}

            # 移动到放回挤出头的位置
            G90
            SET_GCODE_OFFSET X=0.0 Y=0.0 Z=0.0 MOVE=1
            {% if printer.save_variables.variables.current_extruder == 99 %}
                {% if (printer.gcode_move.position.y) > 310 %}
                    G0 Y310 F12000
                {% endif %}
            {% else %}
                {% if (printer.gcode_move.position.y) > 270 %}
                    G0 Y270 F12000
                {% endif %}
            {% endif %}
            G0 X{position_x} Y270 F12000
            G0 Y310 F12000
            G0 Y{position_y-15} F8000
            G0 Y{position_y} F1000
            M400
            G4 P1000

            # 解锁
            _CHECK_AND_UNLOCK T={current_extruder}
            
        {% else %}
            { action_respond_info("UNLOCK: NO TOOl") }
            UNLOCK
        {% endif %}
    {% endif %}



# 检查挤出头是否已被放置
[gcode_macro _CHECK_AND_UNLOCK]
gcode:
    # 判断是否有挤出头
    {% set target_tool = params.T|int %}
    {% set is_nozzle_setting = printer.save_variables.variables.is_nozzle_setting|int %}
    {% if printer['filament_switch_sensor docked%d' % target_tool].filament_detected == False and is_nozzle_setting == 0 %}
        # 失败
        SAVE_VARIABLE VARIABLE=fail_flag VALUE=-1
        { action_respond_info("tool is not properly placed on the mounting bracket") }
    {% else %}
        UNLOCK
        G0 Y310 F6000
        M400
        # 检查是否已解锁
        UNLOCK_TOOL_FINISH
    {% endif %}

# 检查是否已解锁
[gcode_macro UNLOCK_TOOL_FINISH]
gcode:
    {% set fail_flag = printer.save_variables.variables.fail_flag %}
    {% if fail_flag == 0 %}
        {% set vars = printer['filament_switch_sensor sensor_b'] %}
        {% set detected = vars.filament_detected|default('未知') %}
        {% if printer.custom_hall.Raw >= 4700 and detected == False %}
            { action_respond_info("Unlock success") }
            SAVE_VARIABLE VARIABLE=current_extruder VALUE=99
        {% else %}
            # 失败
            SAVE_VARIABLE VARIABLE=fail_flag VALUE=-3
            { action_respond_info("Unlock fail") }
        {% endif %}
    {% endif %}



[gcode_macro LOCK]
gcode:
    {% set distance = -125 | int %}
    ECHELON_STEPPER_HOMING STEPPER=trans_stepper MOVE=150 SPEED=100 PDI={distance}
    M400
    {% for retry in range(1,5) %}
        SET_GCODE_VARIABLE MACRO=_LOCK_CHECK VARIABLE=retry VALUE={retry}
        _LOCK_CHECK
    {% endfor %}
    ECHELON_STEPPER_DISABLE STEPPER=trans_stepper                    #解锁电机
    M400

[gcode_macro _LOCK_CHECK]
variable_retry: 0
gcode:
    M400
    {% set vars = printer['filament_switch_sensor sensor_b'] %}
    {% set detected = vars.filament_detected|default('未知') %}
    {% if detected == False %} 
        {% set distance = -125 - (retry * 10) |int %}
        { action_respond_info("LOCK fail retry %d" % (retry)) }
        ECHELON_STEPPER STEPPER=trans_stepper SPEED=10 MOVE={distance}
    {% endif %}

    
[gcode_macro _LOCK_TOOL]
gcode:
    {% set fail_flag = printer.save_variables.variables.fail_flag %}
    {% if fail_flag == 0 %}
        {% set target_tool = params.T|int %}
        {% set positions = [
                printer.save_variables.variables.t0_position,
                printer.save_variables.variables.t1_position,
                printer.save_variables.variables.t2_position,
                printer.save_variables.variables.t3_position
            ] %}
        {% if 0 <= target_tool <= 3 %}
            {% set position_x, position_y = positions[target_tool] %}
        {% endif %}

        # xy回零判断
        {% if "xy" not in printer.toolhead.homed_axes %}
            G28 X Y
        {% endif %}

        # 移动到目标位置
        G90
        SET_GCODE_OFFSET X=0.0 Y=0.0 Z=0.0 MOVE=1
        {% if printer.save_variables.variables.current_extruder == 99 %}
            {% if (printer.gcode_move.position.y) > 310 %}
                G0 Y310 F12000
            {% endif %}
        {% else %}
            {% if (printer.gcode_move.position.y) > 270 %}
                G0 Y270 F12000
            {% endif %}
        {% endif %}
        G0 X{position_x} Y310 F12000
        G0 Y{position_y+0.4} F9600
        M400

        _CHECK_AND_LOCK T={target_tool}

        # _WAIT_TOOL_TEMPERATURE
        G0 Y310 F9600
        G0 Y270 F12000
        M400

        _CHECK_T_SEQUENCE T={target_tool}
    {% endif %}

# 检查是否已被放置并上锁
[gcode_macro _CHECK_AND_LOCK]
gcode:
    # 判断是否有挤出头
    {% set target_tool = params.T|int %}
    {% set is_nozzle_setting = printer.save_variables.variables.is_nozzle_setting|int %}
    {% if printer['filament_switch_sensor docked%d' % target_tool].filament_detected == False and is_nozzle_setting == 0 %}
        # 失败
        SAVE_VARIABLE VARIABLE=fail_flag VALUE=-1
        { action_respond_info("tool is not properly placed on the mounting bracket") }
    {% else %}
        LOCK
        _LOCK_TOOL_FINISH T={target_tool}
    {% endif %}

# 检查是否已上锁
[gcode_macro _LOCK_TOOL_FINISH]
gcode:
    {% set target_tool = params.T|int %}
    {% set fail_flag = printer.save_variables.variables.fail_flag %}
    {% if fail_flag == 0 %}
        {% set vars = printer['filament_switch_sensor sensor_b'] %}
        {% set detected = vars.filament_detected|default('未知') %}
        {% if printer.custom_hall.Raw < 4700 and detected == True %}
            { action_respond_info("Lock success") }
        {% else %}
            # 失败
            SAVE_VARIABLE VARIABLE=fail_flag VALUE=-2
            { action_respond_info("Lock fail") }
            #转回0度，防止重试时xy回零时掉出
            UNLOCK
        {% endif %}
    {% endif %}

# 检查挤出头顺序是否正确
[gcode_macro _CHECK_T_SEQUENCE]
gcode:
    {% set fail_flag = printer.save_variables.variables.fail_flag %}
    {% if fail_flag == 0 %}
        {% set target_tool = params.T|int %}
        {% set is_nozzle_setting = printer.save_variables.variables.is_nozzle_setting|int %}
        {% if printer['filament_switch_sensor docked%d' % target_tool].filament_detected == True and is_nozzle_setting == 0 %}
            # 失败
            SET_GCODE_VARIABLE MACRO=_CHECK_CHANGE_TOOL VARIABLE=retry VALUE=1
            SAVE_VARIABLE VARIABLE=fail_flag VALUE=-5
            { action_respond_info("sequence error") }
        {% endif %}
    {% endif %}







[gcode_macro T0]
gcode:
    {% set T0_target = printer.save_variables.variables.box_modify_t0|int %}
    _CHANGE_TOOL T={T0_target}
    

[gcode_macro T1]
gcode:
    {% set T1_target = printer.save_variables.variables.box_modify_t1|int %}
    _CHANGE_TOOL T={T1_target}

[gcode_macro T2]
gcode:
    {% set T2_target = printer.save_variables.variables.box_modify_t2|int %}
    _CHANGE_TOOL T={T2_target}

[gcode_macro T3]
gcode:
    {% set T3_target = printer.save_variables.variables.box_modify_t3|int %}
    _CHANGE_TOOL T={T3_target}
    

        
[gcode_macro _CHANGE_TOOL]
variable_save_position: 0
variable_target_tool: 0 
gcode:
    # 重置判断值
    SAVE_VARIABLE VARIABLE=fail_flag VALUE=0
    SET_GCODE_VARIABLE MACRO=_CHECK_CHANGE_TOOL VARIABLE=retry VALUE=0
    
    # 判断保存值
    _check_current_extruder_value
    
    # 判断传感器
    _check_hall_sensor

    # 保存目标头
    {% set target_tool = params.T|int %}
    SAVE_VARIABLE VARIABLE=current_extruder_backup VALUE={target_tool}

    # 检测挤出头是否存在
    _check_tool_exist T={target_tool}

    # 执行换头
    _CHANGING_TOOL T={target_tool}

    # 检测换头是否成功
    _CHECK_CHANGE_TOOL T={target_tool}
    _CHECK_CHANGE_TOOL_AGAIN T={target_tool}

    # 重置保存XY标志位
    SET_GCODE_VARIABLE MACRO=_CHANGE_TOOL VARIABLE=save_position VALUE=1
    

[gcode_macro _CHECK_CHANGE_TOOL_AGAIN]
gcode:
    {% set target_tool = params.T|int %}
    {% set retry = printer['gcode_macro _CHECK_CHANGE_TOOL'].retry %}
    {% if retry == 1 %}
        # 重试判断
        M118 重试判断
        _CHECK_CHANGE_TOOL T={target_tool}
    {% endif %}


# 执行换头
[gcode_macro _CHANGING_TOOL]
gcode:
    {% set current_speed = printer.gcode_move.speed_factor|float %}
    {% set target_tool = params.T|int %}
    {% set current_tool = printer.save_variables.variables.current_extruder %}
    {% set retry = printer['gcode_macro _CHECK_CHANGE_TOOL'].retry %}
    # 回零判断
    {% if "xy" not in printer.toolhead.homed_axes or retry == 1 %}
        G28 X Y
    {% endif %}

    {% set fail_flag = printer.save_variables.variables.fail_flag %}
    {% if fail_flag == 0 %}
        {% if current_tool != target_tool%}

            # 抬升Z轴
            QUERY_ENDSTOPS
            _raise_z
                    
            M118 start change tool T{target_tool}

            # 保存当前XY坐标
            {% if printer_state == "printing" and save_position == 1 %} 
                SAVE_GCODE_STATE NAME=CHANGE_TOOL_PARK
            {% endif %}

            # # 保存加速度
            # _SAVE_SPEED

            # 恢复速度为100%
            M220 S100

            # 放回当前挤出头
            _UNLOCK_TOOL T={current_tool}

            # 抓取当前挤出头
            _LOCK_TOOL T={target_tool}

            # 下降Z轴
            _descend_z

            # 恢复XY坐标
            {% if printer_state == "printing" and save_position == 1 %} 
                RESTORE_GCODE_STATE NAME=CHANGE_TOOL_PARK MOVE=1 MOVE_SPEED=500
            {% endif %}

            # 恢复换头前速度
            M220 S{current_speed * 100}

            # # 恢复加速度
            # _RESTORE_SPEED

            M118 finish change tool T{target_tool}
        {% endif %}
    {% endif %}

# 检查最后换头结果
[gcode_macro _CHECK_CHANGE_TOOL]
variable_retry: 0
gcode:
    {% set printer_state = printer.print_stats.state %}
    {% set target_tool = params.T|int %}
    {% set current_tool = printer.save_variables.variables.current_extruder %}
    # 换头结束判断
    {% set fail_flag = printer.save_variables.variables.fail_flag %}
    {% if fail_flag != 0 and retry == 0 %}
        SET_GCODE_VARIABLE MACRO=_CHECK_CHANGE_TOOL VARIABLE=retry VALUE=1
        # {% if printer_state != "printing" %}
            # 重置判断值
            SAVE_VARIABLE VARIABLE=fail_flag VALUE=0
            _check_current_extruder_value
            _check_hall_sensor
            _check_tool_exist T={target_tool}
            _CHANGING_TOOL T={target_tool}
        # {% else %}
        #     SAVE_VARIABLE VARIABLE=fail_flag VALUE=-6
        #     { action_respond_info("printing change tool failed") }
        # {% endif %}
    {% elif fail_flag != 0 and retry == 1 %}
        # 第二次失败
        {% if printer_state == "printing" %}
            G28 X Y
            G90
            G1 X150 Y1 F6000
            PAUSE
        {% endif %}
        {% if fail_flag == -1 %}
            { action_respond_info("!! Please check whether head %d is properly placed on the mounting bracket." % (target_tool+1)) } # 目标挤出头没有位置上
        {% elif fail_flag == -2 %}
            { action_respond_info("!! Failed to take extruder %d , please check if it is placed correctly." % (target_tool+1)) }    # 上锁失败
        {% elif fail_flag == -3 %}
            { action_respond_info("!! Head %d unlock failed" % (current_tool+1)) }  # 放回解锁失败
        {% elif fail_flag == -4 %}
            { action_respond_info("!! Hall sensor error") }  # 传感器错误
        {% elif fail_flag == -5 %}
            { action_respond_info("!! A change in extruder position has been detected. Please reconfigure the extruder sequence and do offset calibration!") } # 当前挤出头顺序异常
        {% elif fail_flag == -6 %}
            { action_respond_info("!! Model misalignment alert. Please click to continue printing, check the status at the resumed printing point, and determine whether reprinting is required. ") }
        {% endif %}
        SAVE_VARIABLE VARIABLE=fail_flag VALUE=0
    {% else %}
        # 成功
        SAVE_VARIABLE VARIABLE=current_extruder VALUE={target_tool}
        # 设置偏移量
        _OFFSET_SET
        # 恢复挤出速度
        {% set var_name = 't' ~ target_tool ~ '_flow_extruder' %}
        M221 S{printer.save_variables.variables[var_name]}
        # 使能堵料传感器
        _ENABLE_SENSOR T={target_tool}
        # 激活当前挤出头
        {% set extruder_name = 'extruder' if target_tool == 0 else 'extruder' ~ target_tool %}
        ACTIVATE_EXTRUDER EXTRUDER={extruder_name}
        SET_PRESSURE_ADVANCE EXTRUDER={extruder_name} ADVANCE=0.04
    {% endif %}


# 上升z轴
[gcode_macro _raise_z]
gcode:
    {% set fail_flag = printer.save_variables.variables.fail_flag %}
    # {% set conf_max_z = printer.configfile.settings.stepper_z.position_endstop|int %}
    {% if fail_flag == 0 %}
        {% if "z" in printer.toolhead.homed_axes and printer.toolhead.position.z < 2 %}
            G91 
            G1 Z2 F800
            G90
            SET_GCODE_VARIABLE MACRO=_descend_z VARIABLE=need_descend VALUE=1
        {% elif "z" not in printer.toolhead.homed_axes and printer.query_endstops.last_query.z==0 %}
            SET_KINEMATIC_POSITION Z=2
            G91
            G1 Z2 F800
            G90
            SET_GCODE_VARIABLE MACRO=_descend_z VARIABLE=need_descend VALUE=1
        {% else %}
            SET_GCODE_VARIABLE MACRO=_descend_z VARIABLE=need_descend VALUE=0
        {% endif %}
        M400
    {% endif %}


# 下降Z轴
[gcode_macro _descend_z]
variable_need_descend: 0
gcode:
    {% if need_descend == 1 %}
        G91
        G1 Z-2 F800
        G90
        SET_GCODE_VARIABLE MACRO=_descend_z VARIABLE=need_descend VALUE=0
    {% endif %}
    M400

# 检测挤出头是否存在
[gcode_macro _check_tool_exist]
gcode:
    {% set fail_flag = printer.save_variables.variables.fail_flag %}
    {% if fail_flag == 0 %}
        {% set target_tool = params.T|int %}
        {% set thr_number = printer.save_variables.variables.thr_number|int %}
        {% if target_tool >= thr_number and target_tool != 99%}
            SAVE_VARIABLE VARIABLE=fail_flag VALUE=-1
            { action_respond_info("tool is not properly placed on the mounting bracket") }
        {% endif %}
        {% set current_tool = printer.save_variables.variables.current_extruder %}
        {% if printer.custom_hall.Raw < 4700 and current_tool == target_tool and printer['filament_switch_sensor docked%d' % target_tool].filament_detected == False%}
            { action_respond_info("current_extruder == target_tool") }
        {% endif %}
    {% endif %}

# 检测霍尔传感器是否正常
[gcode_macro _check_hall_sensor]
gcode:
    {% set fail_flag = printer.save_variables.variables.fail_flag %}
    {% if fail_flag == 0 %}
        {% set hall = printer.custom_hall.Raw %}
        {% if hall > 6000 or hall < 3450 %}
            # 失败
            SAVE_VARIABLE VARIABLE=fail_flag VALUE=-4
            { action_respond_info("Hall sensor error") }
        {% endif %}
    {% endif %}

# 检测当前保存值是否正常
[gcode_macro _check_current_extruder_value]
gcode:
    {% set fail_flag = printer.save_variables.variables.fail_flag %}
    {% if fail_flag == 0 %}
        {% set thr_number = printer.save_variables.variables.thr_number|int %}
        {% set current_extruder = printer.save_variables.variables.current_extruder %}
        # 有头但没保存正确值
        {% if printer.custom_hall.Raw < 4700 and current_extruder == 99 %}
            {% for i in range(thr_number) %}
                {% if printer['filament_switch_sensor docked%d' % i].filament_detected == False %}
                    { action_respond_info("修改当前值为%d" % i) }
                    SAVE_VARIABLE VARIABLE=current_extruder VALUE={i}
                {% endif %}
            {% endfor %}
        {% elif printer.custom_hall.Raw >= 4700 %}
            SAVE_VARIABLE VARIABLE=current_extruder VALUE=99
        {% endif %}
    {% endif %}






    


[gcode_macro _WAIT_TOOL_TEMPERATURE]
gcode:
    # {% set extruder = printer.toolhead.extruder %}
    # {% set TARGET_TEMP = printer.extruder.target %}
    # M109 S{TARGET_TEMP} T{target_tool}
    {% set printer_state = printer.print_stats.state %}
    {% if printer_state == "printing" or printer_state == "paused" %} 
        {% set extruder = printer.toolhead.extruder %}
        {% if extruder == "extruder" %}
            {% set temp = printer.extruder.target %}
            { action_respond_info("WAIT %s S%d" % (extruder, temp)) }
            M109 S{temp} T0
        {% elif extruder == "extruder1" %}
            {% set temp = printer.extruder1.target %}
            { action_respond_info("WAIT %s S%d" % (extruder, temp)) }
            M109 S{temp} T1
        {% elif extruder == "extruder2" %}
            {% set temp = printer.extruder2.target %}
            { action_respond_info("WAIT %s S%d" % (extruder, temp)) }      
            M109 S{temp} T2
        {% elif extruder == "extruder3" %}
            {% set temp = printer.extruder3.target %}
            { action_respond_info("WAIT %s S%d" % (extruder, temp)) }  
            M109 S{temp} T3
        {% endif %}
    {% endif %}

[gcode_macro _SAVE_SPEED]
variable_accel: 0
variable_velocity: 0
gcode:
    {% set accel = (printer.toolhead.max_accel)*0.5 %}
    {% set velocity = printer.toolhead.max_velocity %}
    {% set conf_max_accel = (printer.configfile.settings.printer.max_accel*0.5)|int %}
    {% set conf_max_velocity = printer.configfile.settings.printer.max_velocity|int %}

    SET_GCODE_VARIABLE MACRO=_SAVE_SPEED VARIABLE=accel VALUE={accel}
    SET_GCODE_VARIABLE MACRO=_SAVE_SPEED VARIABLE=velocity VALUE={velocity}

    {% if velocity != conf_max_velocity and accel != conf_max_accel %}
        SET_VELOCITY_LIMIT VELOCITY={conf_max_velocity} ACCEL={conf_max_accel}
        { action_respond_info("SAVE SPEED ACCEL%f VELOCITY%f" % (accel, velocity)) }
    {% elif velocity != conf_max_velocity and accel == conf_max_accel %}
        SET_VELOCITY_LIMIT VELOCITY={conf_max_velocity}
        { action_respond_info("SAVE SPEED  VELOCITY%f" % (velocity)) }
    {% elif velocity == conf_max_velocity and accel != conf_max_accel %}
        SET_VELOCITY_LIMIT ACCEL={conf_max_accel}
        { action_respond_info("SAVE SPEED ACCEL%f" % (accel)) }
    {% endif %}
    # { action_respond_info("SAVE SPEED ACCEL%f VELOCITY%f" % (accel, velocity)) }

[gcode_macro _RESTORE_SPEED]
gcode:
    {% set accel_set = printer.toolhead.max_accel %}
    {% set velocity_set = printer.toolhead.max_velocity %}
    {% set vars = printer['gcode_macro _SAVE_SPEED'] %}
    {% set accel = vars.accel %}
    {% set velocity = vars.velocity %}

    {% if velocity != velocity_set and accel != accel_set %}
        SET_VELOCITY_LIMIT VELOCITY={accel} ACCEL={velocity}
        { action_respond_info("RESTORE SPEED ACCEL%f VELOCITY%f" % (accel, velocity)) }
    {% elif velocity != velocity_set and accel == accel_set %}
        SET_VELOCITY_LIMIT VELOCITY={velocity}
        { action_respond_info("RESTORE SPEED  VELOCITY%f" % (velocity)) }
    {% elif velocity == velocity_set and accel != accel_set %}
        SET_VELOCITY_LIMIT ACCEL={accel}
        { action_respond_info("RESTORE SPEED ACCEL%f" % (accel)) }
    {% endif %}




[gcode_macro GET_TOOL_POSITION]
gcode:
    GET_T_POSITION
    G28 X Y
    G1 X150 Y200 F9600

[gcode_macro TEST_ROUND]
gcode:
    {% set thr_number = printer.save_variables.variables.thr_number|int %}
    {% if "xy" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    {% for i in range(thr_number) %}
        T{i}
        WIPE_NOZZLE
        CALIBRATE_TOOL_OFFSETS T={i}
    {% endfor %}

[gcode_macro SAVE_T_POSITON]
gcode:
    {% set t = params.T|default(99)|int %}
    {% set position_x = params.X|default(99)|float|round(6) %}
    {% set position_y = params.Y|default(99)|float|round(6) %}

    {% if t == 0 %}
        {% set origin_x, origin_y = printer.save_variables.variables.t0_position %}
    {% elif t ==1 %}
        {% set origin_x, origin_y = printer.save_variables.variables.t1_position %}
    {% elif t ==2 %}
        {% set origin_x, origin_y = printer.save_variables.variables.t2_position %}
    {% elif t ==3 %}
        {% set origin_x, origin_y = printer.save_variables.variables.t3_position %}
    {% endif %}

    {% if position_x == 99 %}
        {% set position_x = origin_x %}
    {% endif %}

    {% if position_y == 99 %}
        {% set position_y = origin_y %}
    {% endif %}

    # 判断坐标是否在合法范围内
    {% if t == 0 and (position_x > 50 or position_x < 40 or position_y > 347 or position_y < 335) %}
        { action_respond_info("!! T0 GET POSITON ERROR") }
        {% set position_x = origin_x %}
        {% set position_y = origin_y %}
    {% endif %}

    {% if t == 1 and (position_x > 110 or position_x < 100 or position_y > 347 or position_y < 335) %}
        { action_respond_info("!! T1 GET POSITON ERROR") }
        {% set position_x = origin_x %}
        {% set position_y = origin_y %}
    {% endif %}

    {% if t == 2 and (position_x > 173 or position_x < 163 or position_y > 347 or position_y < 335) %}
        { action_respond_info("!! T2 GET POSITON ERROR") }
        {% set position_x = origin_x %}
        {% set position_y = origin_y %}
    {% endif %}

    {% if t == 3 and (position_x > 235 or position_x < 225 or position_y > 347 or position_y < 335) %}
        { action_respond_info("!! T3 GET POSITON ERROR") }
        {% set position_x = origin_x %}
        {% set position_y = origin_y %}
    {% endif %}

    {% if t != 99 %}
        SAVE_VARIABLE VARIABLE=t{t}_position VALUE={position_x},{position_y}
        { action_respond_info("SAVE T%d POSITON X:%f Y:%f" % (t, position_x, position_y)) }
    {% endif %}


[gcode_macro _SAVE_TOOL_POSITION]
gcode:
    {% set tool = params.T|default(99)|int %}
    {% set position_x, position_y, position_z = printer.custom_hall.last_toolhead_position %}
    {% if tool != 99 %}
        {% if position_x == 0 or position_y == 0 %}
            { action_respond_info("RUN GET_T_POSITION FIRST") }
        {% else %}
            SAVE_T_POSITON T={tool} X={position_x} Y={position_y}
        {% endif %}
    {% else %}
        { action_respond_info("TOOL UNSPECIFIED") }
    {% endif %}

[gcode_macro CALIBRATE_TOOL_POSITION]
gcode:
    {% set tool = params.T|default(99)|int %}
    GET_T_POSITION
    _SAVE_TOOL_POSITION T={tool}

[gcode_macro _ENABLE_SENSOR]
gcode:
    {% set thr_number = printer.save_variables.variables.thr_number|int %}
    {% set tool = params.T|default(0)|int %}
    {% for i in range(thr_number) %}
        SET_FILAMENT_SENSOR SENSOR=filament{i} ENABLE=0
    {% endfor %}
    SET_FILAMENT_SENSOR SENSOR=filament{tool} ENABLE=1



[gcode_macro PARK_CURRENT_TOOL]
gcode:
    SAVE_VARIABLE VARIABLE=fail_flag VALUE=0
    {% set save_t = printer.save_variables.variables.current_extruder|int %}
    _UNLOCK_TOOL T={save_t}
    PARK_CURRENT_TOOL_RETRY

[gcode_macro PARK_CURRENT_TOOL_RETRY]
gcode:  
    {% set fail_flag = printer.save_variables.variables.fail_flag|int %}
    {% if fail_flag != 0 %}
        G28 X Y
        SAVE_VARIABLE VARIABLE=fail_flag VALUE=0
        {% set save_t = printer.save_variables.variables.current_extruder|int %}
        _UNLOCK_TOOL T={save_t}
    {% endif %}
 
[gcode_macro _OFFSET_SET]
gcode:
    {% if "xy" not in printer.toolhead.homed_axes or retry == 1 %}
        G28 X Y
    {% endif %}
    {% set tool = printer.save_variables.variables.current_extruder %}
    {% if tool == 0 %}
        {% set offset_x, offset_y, offset_z = printer.save_variables.variables.t0_offset %}
    {% elif tool == 1 %}
        {% set offset_x, offset_y, offset_z = printer.save_variables.variables.t1_offset %}
    {% elif tool == 2 %}
        {% set offset_x, offset_y, offset_z = printer.save_variables.variables.t2_offset %}
    {% elif tool == 3 %}
        {% set offset_x, offset_y, offset_z = printer.save_variables.variables.t3_offset %}
    {% endif %}
    {% if tool != 99 %}
        # { action_respond_info("SET GCODE OFFSET X:%6f Y:%6f Z:%6f" % (offset_x, offset_y, offset_z)) }
        SET_GCODE_OFFSET X={offset_x} Y={offset_y} Z={offset_z} move=1
    {% endif %}

[gcode_macro _OFFSET_RESET]
gcode:
    {% if "xy" not in printer.toolhead.homed_axes or retry == 1 %}
        G28 X Y
    {% endif %}
    SET_GCODE_OFFSET X=0 Y=0 Z=0 move=1