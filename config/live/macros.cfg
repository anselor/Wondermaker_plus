# >>> wondermaker+ begin: filament-service-clearance
# Stock load and unload travel to their purge positions at the current Z.
# Lift first, leave the bed along X, then travel along the off-bed edge. This
# remains available for a paused runout change but never interrupts an active
# print or invents coordinates for unhomed axes.
[gcode_macro _WMP_FILAMENT_SERVICE_POSITION]
variable_hop: 5.0
variable_x: -13.0
variable_y: 80.0
gcode:
    {% if printer.print_stats.state == 'printing' %}
        { action_raise_error('Pause the print before moving to the filament service position') }
    {% endif %}
    {% if 'xyz' not in printer.toolhead.homed_axes %}
        { action_raise_error('Home XYZ before loading or unloading filament') }
    {% endif %}
    {% set available = printer.toolhead.axis_maximum.z|float - printer.toolhead.position.z|float %}
    {% set lift = [hop|float, available]|min %}
    G91
    {% if lift > 0 %}
        G1 Z{lift} F800
    {% endif %}
    G90
    G1 X{x} F6000
    G1 Y{y} F6000
# <<< wondermaker+ end: filament-service-clearance

[gcode_macro EXTRUDE_FILAMENT]
variable_extrude_length:100
gcode:
    {% set T = params.T|default(0)|int %}
    _WMP_FILAMENT_SERVICE_POSITION
    {% if printer[printer.toolhead.extruder].temperature < printer.configfile.settings.extruder.min_extrude_temp %} 
        M109 S220 T{T}
    {% endif %}
    M400
    M106 S0
    M83
    G92 E0 
    G91
    # G1 Z-6 F2000.0
    G1 E{extrude_length} F400
    G90
    M106 S255
    M400
    M109 S160 T{T}
    M106 S0
    M400
    WIPE_NOZZLE
    PARK_CURRENT_TOOL


# >>> wondermaker+ begin: u1-tip-shaping (ported from Snapmaker U1 fw 1.6.0 CONTROL_RETRACT_ACTION, 2026-08-29)
# Why: stock unload leaves a blobbed, stringy tip. Sequences from Snapmaker
# U1 1.6.0 (pla/abs/soft) and Prusa PrusaResearch.ini *PETPG* (petg), chosen
# by material class. Net retraction -57 mm (stock); petg -67. Details:
# config/README.md "u1-tip-shaping".
[gcode_macro _TIP_SHAPE_RETRACT]
description: U1-style tip-shaping unload for the active (or T=) tool. MATERIAL= overrides detection; CLASS=pla|abs|soft skips it. Assumes the hotend is already at temperature.
variable_result: 'pla'
variable_source: 'default'
variable_material: ''
variable_slot: 0
# Unload temperature per material (U1 table; PETG/PET per test: cooler is
# better). unload_temp_min: floor for unlisted materials, 0 disables.
# TEMP_MIN= overrides per call.
variable_unload_temp_min: 250
variable_unload_temps: {'PLA': 250, 'PVA': 250, 'MARBLE': 250, 'WOOD': 250, 'PETG': 235, 'PET': 235, 'ABS': 280, 'ASA': 280, 'HIPS': 280, 'PA': 280, 'PC': 300, 'TPU': 250, 'TPE': 250}
gcode:
  {% if params.CLASS is defined %}
    _TIP_SHAPE_MOVES CLASS={params.CLASS}
  {% else %}
    {% set phys = printer.toolhead.extruder %}
    {% set phys_idx = 0 %}
    {% if phys != 'extruder' %}{% set phys_idx = phys[8:]|int %}{% endif %}
    # Materials are per logical slot; find the slot mapped to this physical tool.
    {% set sv = printer.save_variables.variables %}
    {% set owners = [phys_idx] %}
    {% for i in range(4) %}
        {% if sv['box_modify_t%d' % i]|default(i)|int == phys_idx %}{% set _ = owners.append(i) %}{% endif %}
    {% endfor %}
    {% set slot = params.T|default(owners[-1])|int %}
    {% set cls = 'pla' %}{% set src = 'default' %}{% set mat = '' %}
    {% if params.MATERIAL is defined %}
        {% set mat = params.MATERIAL|string %}{% set src = 'param' %}
    {% elif 'wm_material' in printer and printer.wm_material.available %}
        {% set mat = printer.wm_material['material%d' % slot] %}{% set src = 'wm_material' %}
    {% endif %}
    {% if mat != '' and mat != 'Unknown' %}
        {% set m = mat|upper %}
        {% if m.startswith('TPU') or m.startswith('TPE') %}{% set cls = 'soft' %}
        {% elif m.startswith('PETG') or m.startswith('PCTG') or m == 'PET' %}{% set cls = 'petg' %}
        {% elif m.startswith('ABS') or m.startswith('ASA') or m.startswith('HIPS') or m == 'WOOD' %}{% set cls = 'abs' %}
        {% endif %}
    {% else %}
        {% set t = printer[phys].target|float %}
        {% set src = 'temp %d' % t %}
        {% if t >= 225 and t <= 235 %}{% set cls = 'soft' %}
        {% elif t >= 255 %}{% set cls = 'abs' %}
        {% endif %}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_TIP_SHAPE_RETRACT VARIABLE=result VALUE='"{cls}"'
    SET_GCODE_VARIABLE MACRO=_TIP_SHAPE_RETRACT VARIABLE=source VALUE='"{src}"'
    SET_GCODE_VARIABLE MACRO=_TIP_SHAPE_RETRACT VARIABLE=material VALUE='"{mat}"'
    SET_GCODE_VARIABLE MACRO=_TIP_SHAPE_RETRACT VARIABLE=slot VALUE={slot}
    {% set label = src %}
    {% if mat != '' %}{% set label = src ~ ' ' ~ mat %}{% endif %}
    RESPOND MSG="Unload tip-shaping: slot T{slot} class={cls} ({label})"
    {% set boost = unload_temp_min|float %}
    {% if mat != '' %}
        {% set key = (mat|upper).split(' ')[0] %}
        {% if key in unload_temps %}{% set boost = unload_temps[key]|float %}{% endif %}
    {% elif cls == 'abs' %}
        {% set boost = [boost, 280]|max %}
    {% endif %}
    {% if unload_temp_min|float <= 0 %}{% set boost = 0 %}{% endif %}
    {% set boost = params.TEMP_MIN|default(boost)|float %}
    {% set boost = [boost, printer.configfile.settings[phys].max_temp|float - 5]|min %}
    # Vendor M109/M104 default a missing T to T0; T is a logical slot.
    {% if boost > 0 and (printer[phys].target|float - boost)|abs > 1 %}
    RESPOND MSG="Unload tip-shaping: setting {phys} (slot T{slot}) to {boost|int} C (table value, touchscreen had {printer[phys].target|int})"
    {% if params.DRY_RUN is not defined %}
    M109 S{boost|int} T{slot}
    {% endif %}
    {% endif %}
    {% if params.DRY_RUN is not defined %}
    _TIP_SHAPE_MOVES CLASS={cls}
    {% endif %}
  {% endif %}

# E moves only. CLASS is a parameter: a caller's Jinja renders before its
# sub-macros run, so it cannot read a variable set by _TIP_SHAPE_RETRACT.
[gcode_macro _TIP_SHAPE_MOVES]
# petg cooling moves (Prusa: 3 at 5 -> 2.5 mm/s) and stamping distance
# (Prusa 45 mm; 35 here so the stub stops 5 mm short of the start).
variable_cooling_moves: 3
variable_cooling_len: 10
variable_cooling_speed_list: [300, 240, 150]
variable_stamp_len: 35
gcode:
    {% set cls = params.CLASS|default('pla')|lower %}
    M83
    G92 E0
    {% if cls == 'soft' %}
    G1 E5 F600      ; small purge
    G1 E-27 F2700   ; fast pull out of the melt zone
    G1 E-5.5 F40    ; very slow pull draws the cone
    G1 E-29.5 F1500 ; final extraction (U1: -37.5 + feeder; ours: net -57)
    {% elif cls == 'petg' %}
    ; Prusa PrusaResearch.ini *PETPG* recipe. U1-style slow pulls draw
    ; PETG into a long strand.
    G1 E15 F400     ; purge slow: fresh melt
    G1 E25 F1050    ; ram, 17.5 mm/s (Prusa). Skips a few steps here; see final pull
    G1 E-40 F3600   ; single fast pull at 60 mm/s (Prusa), no slow phase
    {% for i in range(cooling_moves) %}
    G1 E{cooling_len} F{cooling_speed_list[i % (cooling_speed_list|length)]}
    G1 E-{cooling_len} F{cooling_speed_list[i % (cooling_speed_list|length)]}
    {% endfor %}
    G1 E{stamp_len} F1590   ; stamping: push the stub back at 26.5 mm/s
    G1 E-{stamp_len} F3600  ; and pull again
    G1 E-27 F1500   ; final extraction: net -67 (stock -57 + 10 mm margin for ram skips)
    {% elif cls == 'abs' %}
    G1 E20 F400     ; purge slow: fresh, uniform melt in the nozzle
    G1 E10 F1500    ; purge fast
    G1 E-35 F3000   ; fast pull out of the melt zone
    G1 E-5 F50      ; very slow pull: draws the molten tail into a thin cone
    G1 E25 F400     ; re-plunge (slower for ABS): re-melt and round off the tip
    G1 E15 F900
    G1 E-35 F3300   ; second fast pull
    G1 E-5 F50      ; second slow pull, finishes the cone
    G1 E-47 F1500   ; final extraction (U1: -30 + feeder; ours: net -57 = stock)
    {% else %}
    G1 E20 F400     ; purge slow: fresh, uniform melt in the nozzle
    G1 E10 F1500    ; purge fast
    G1 E-35 F3000   ; fast pull out of the melt zone
    G1 E-5 F50      ; very slow pull: draws the molten tail into a thin cone
    G1 E25 F1000    ; re-plunge: re-melt and round off the tip
    G1 E15 F1500
    G1 E-35 F3300   ; second fast pull
    G1 E-5 F25      ; second slow pull, finishes the cone
    G1 E-47 F1500   ; final extraction (U1: -30 + feeder; ours: net -57 = stock)
    {% endif %}
    M400

[gcode_macro RETRACT_FILAMENT]
# After the moves: heater off, fan, post_cool_s, WIPE_NOZZLE (as U1).
variable_post_cool_s: 5
gcode:
    # Purge where EXTRUDE_FILAMENT purges (stock: X-13 Y232, over the wiper).
    _WMP_FILAMENT_SERVICE_POSITION
    _TIP_SHAPE_RETRACT {rawparams}
    G90
    M400
    # Logical slot for the vendor M104 (sub-macro variables are not visible here).
    {% set phys = printer.toolhead.extruder %}
    {% set phys_idx = 0 %}
    {% if phys != 'extruder' %}{% set phys_idx = phys[8:]|int %}{% endif %}
    {% set sv = printer.save_variables.variables %}
    {% set owners = [phys_idx] %}
    {% for i in range(4) %}
        {% if sv['box_modify_t%d' % i]|default(i)|int == phys_idx %}{% set _ = owners.append(i) %}{% endif %}
    {% endfor %}
    {% set slot = params.T|default(owners[-1])|int %}
    M104 S0 T{slot}
    M106 S255
    G4 P{(post_cool_s|float * 1000)|int}
    WIPE_NOZZLE
    M107
    M400
# <<< wondermaker+ end: u1-tip-shaping (stock: G1 E3 F600 / E-20 F3500 / G4 P5000 / E10 F1000 / E-50 F1000)

[gcode_macro LOAD_FILAMENT]
variable_extrude_length:100
gcode:
    {% set T  = params.T|default(0)|int %}
    {% if T == 0 %}
        ACTIVATE_EXTRUDER EXTRUDER=extruder
    {% else %}
        ACTIVATE_EXTRUDER EXTRUDER=extruder{T}
    {% endif %}
    M109 S220 T{T}
    M83
    G92 E0 
    G91
    G1 E{extrude_length} F400
    G90
    M400
    M104 S0 T{T}
    SET_STEPPER_ENABLE STEPPER={printer.toolhead.extruder} ENABLE=0 

[gcode_macro UNLOAD_FILAMENT]
variable_extrude_length:2
variable_retract_length:45
gcode:
    {% set T = params.T|default(0)|int %}
    {% if T == 0 %}
        ACTIVATE_EXTRUDER EXTRUDER=extruder
    {% else %}
        ACTIVATE_EXTRUDER EXTRUDER=extruder{T}
    {% endif %}
    M109 S220 T{T}
    # >>> wondermaker+ begin: u1-tip-shaping (see RETRACT_FILAMENT above)
    # Why: same tip shaping as RETRACT_FILAMENT (stock netted -43 mm here).
    _TIP_SHAPE_RETRACT T={T}
    # <<< wondermaker+ end: u1-tip-shaping (stock: G1 E{extrude_length} F400 / G1 E-{retract_length} F600)
    G90
    M400
    M104 S0 T{T}
    SET_STEPPER_ENABLE STEPPER={printer.toolhead.extruder} ENABLE=0

[gcode_macro M221]
rename_existing:M99221
gcode:
    M99221 S{params.S|int} 
    {% if params.T is defined %}
        SAVE_VARIABLE VARIABLE=t{params.T|int}_flow_extruder VALUE={params.S|int}
    {% endif %}

[gcode_macro RESET_FLOW_EXTRUDER]
description: 恢复设置挤出机流量百分比
gcode:
    {% set thr_number = printer.save_variables.variables.thr_number|int %}
    {% for i in range(thr_number) %}
        M221 S100 T{i}
    {% endfor %}

[gcode_macro filament_insert_gcode]
gcode:
    {% set T = params.T|default(0)|int %}
    _WMP_FILAMENT_SERVICE_POSITION
    M109 S220 T{T}
    M83
    G92 E0 
    G1 E100 F600    
    M400
    WIPE_NOZZLE

[gcode_macro filament_insert]
gcode:
    M83
    G92 E0 
    G1 E15 F600
