[gcode_macro EXTRUDE_FILAMENT]
variable_extrude_length:100
gcode:
    {% set current_extruder = printer.toolhead.extruder %}
    {% if current_extruder == "extruder" %}
        {% set targe_temprature = printer.extruder.target %}
        {% set tool = 0 %}
    {% elif current_extruder == "extruder1" %}
        {% set targe_temprature = printer.extruder1.target %}
        {% set tool = 1 %}
    {% elif current_extruder == "extruder2" %}
        {% set targe_temprature = printer.extruder2.target %}
        {% set tool = 2 %}
    {% elif current_extruder == "extruder3" %}
        {% set targe_temprature = printer.extruder3.target %}
        {% set tool = 3 %}
    {% endif %}

    M400
    M106 S0
    G90
    G1 X-13 Y80 F6000  ; 移动到安全位置  ; 移动到安全位置
    M83
    G92 E0 
    G91
    # G1 Z-6 F2000.0
    G1 E{extrude_length} F400
    G90
    M106 S255
    M400
    M109 S160 T{tool}
    M106 S0
    # >>> wondermaker+ begin: load-auto-wipe (original fix, 2026-08-18)
    # Why: after the load purge the screen asks the user to clean the nozzle
    # tip manually (dialog is baked into the UI binary). The blob is already
    # fan-cooled to 160C and the machine has a nozzle wiper 200mm away — use
    # it, so the manual-clean dialog becomes a formality.
    WIPE_NOZZLE
    # <<< wondermaker+ end: load-auto-wipe


