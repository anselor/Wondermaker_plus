[delayed_gcode PRINTER_INIT]
initial_duration:5.0
gcode:
    RESET_FLOW_EXTRUDER


[gcode_macro START_PRINT] #开始打印宏
variable_adaptive_mesh: False
variable_adaptive_mesh_enable:True
variable_print_body_ready: False
gcode:
    SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=print_body_ready VALUE=False
    # >>> wondermaker+ begin: print-mesh-context-start
    SAVE_VARIABLE VARIABLE=wmp_print_context VALUE="{ {} }"
    SET_GCODE_VARIABLE MACRO=_WMP_RECOVERY_BEGIN VARIABLE=active VALUE=False
    # <<< wondermaker+ end: print-mesh-context-start
    M118 START_PRINT begin
    {% set BED = params.BED|int %}
    {% set EXTRUDER = params.EXTRUDER|int %}
    {% set INITIAL_TOOL = params.INITIAL_TOOL|int %}
    {% if params.MESH_MIN_X is defined and params.MESH_MIN_Y is defined and params.MESH_MAX_X is defined and params.MESH_MAX_Y is defined and params.PROBE_COUNT_X is defined and params.PROBE_COUNT_Y is defined %}
        {% set MESH_MIN_X = params.MESH_MIN_X|float %}
        {% set MESH_MIN_Y = params.MESH_MIN_Y|float %}
        {% set MESH_MAX_X = params.MESH_MAX_X|float %}
        {% set MESH_MAX_Y = params.MESH_MAX_Y|float %}
        {% set PROBE_COUNT_X = params.PROBE_COUNT_X|int %}
        {% set PROBE_COUNT_Y = params.PROBE_COUNT_Y|int %}
        {% set adaptive_mesh = True %}
    {% else %}
        {% set adaptive_mesh = False %}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=adaptive_mesh VALUE=0
    SET_VELOCITY_LIMIT VELOCITY={printer.configfile.settings.printer.max_velocity}
    SET_VELOCITY_LIMIT ACCEL={printer.configfile.settings.printer.max_accel}
    SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={BED}
    # SET_HEATER_TEMPERATURE HEATER=extruder TARGET={EXTRUDER}

    ;初始化mmu相关的宏
    # MMU_START_SETUP INITIAL_TOOL={initial_tool} REFERENCED_TOOLS=!referenced_tools! TOOL_COLORS=!colors! TOOL_TEMPS=!temperatures! TOOL_MATERIALS=!materials! PURGE_VOLUMES=!purge_volumes!
    ;调用开始检查
    # MMU_START_CHECK
    # _TOOL_CHECK
    
    BED_MESH_CLEAR                 # Unloading net beds
    {% set t = printer.save_variables.variables.box_modify_t0|int %}
    SAVE_VARIABLE VARIABLE=box_modify_t0  value=0
    M140 S{BED}
    # >>> wondermaker+ begin: probe-with-initial-tool (ours, 2026-08-30; design in docs/design-ideas.md #1)
    # Why: home and mesh with the print's first tool instead of T0 (saves two
    # toolchanges and a heat cycle). See config/README.md "probe-with-initial-tool".
    {% set svv = printer.save_variables.variables %}
    {% set probe_tool = 0 %}
    {% if svv.probe_with_initial_tool|default(True) and adaptive_mesh_enable == True %}
        {% set probe_tool = svv['box_modify_t%d' % INITIAL_TOOL]|default(INITIAL_TOOL)|int %}
    {% endif %}
    SAVE_VARIABLE VARIABLE=probe_tool VALUE={probe_tool}
    {% set probe_heater = 'extruder' if probe_tool == 0 else 'extruder%d' % probe_tool %}
    {% if probe_tool == 0 %}
    M109 S{140} T0
    {% else %}
    M118 probe-with-initial-tool: homing and meshing with physical T{probe_tool} (INITIAL_TOOL={INITIAL_TOOL})
    SET_HEATER_TEMPERATURE HEATER={probe_heater} TARGET=140
    TEMPERATURE_WAIT SENSOR={probe_heater} MINIMUM=137.5 MAXIMUM=142.5
    {% endif %}
    # <<< wondermaker+ end: probe-with-initial-tool (stock: M109 S{140} T0)
    G28 
    M190 S{BED}
    # >>> wondermaker+ begin: print-mesh-profile-isolation
    {% if adaptive_mesh_enable == True %}                              
        {% if adaptive_mesh == True %}
            # M118 adaptive_mesh:{adaptive_mesh}
            #SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=adaptive_mesh VALUE=1
            {action_respond_info("adaptive_mesh: %s" % adaptive_mesh) }
            BED_MESH_CALIBRATE PROFILE=wmp_print MESH_MIN={MESH_MIN_X},{MESH_MIN_Y} MESH_MAX={MESH_MAX_X},{MESH_MAX_Y} PROBE_COUNT={PROBE_COUNT_X},{PROBE_COUNT_Y} #ADAPTIVE=0 #ALGORITHM=[bed_mesh_algo] #ADAPTIVE_MARGIN=0
        # >>> wondermaker+ begin: adaptive-parameter-type
        {% elif params.ADAPTIVE is defined and params.ADAPTIVE|int == 1 %} #use klipper adaptive_mesh
        # <<< wondermaker+ end: adaptive-parameter-type
            {% if params.ADAPTIVE_MARGIN is defined %}
                BED_MESH_CALIBRATE PROFILE=wmp_print ADAPTIVE={params.ADAPTIVE} ADAPTIVE_MARGIN={params.ADAPTIVE_MARGIN}
            {% else %}
                BED_MESH_CALIBRATE PROFILE=wmp_print ADAPTIVE={params.ADAPTIVE}
            {% endif %}
        {% else %}
            BED_MESH_CALIBRATE PROFILE=wmp_print
        {% endif %}
    {% else %}
        BED_MESH_PROFILE LOAD="default"
    {% endif %}
    # <<< wondermaker+ end: print-mesh-profile-isolation
    # >>> wondermaker+ begin: print-mesh-context-save
    # Snapshot even a loaded default mesh for this print's recovery. Native
    # ADAPTIVE=1 suppresses implicit profile saving, so save explicitly here.
    BED_MESH_PROFILE_BASE SAVE=wmp_print
    BED_MESH_PROFILE_BASE LOAD=wmp_print
    SAVE_CONFIG_NO_RESTART
    M118 START_PRINT adaptive_mesh
    # <<< wondermaker+ end: print-mesh-context-save
    # >>> wondermaker+ begin: probe-with-initial-tool-cool
    {% if probe_tool == 0 %}
    M104 S0 T0
    {% else %}
    SET_HEATER_TEMPERATURE HEATER={probe_heater} TARGET=0
    {% endif %}
    # <<< wondermaker+ end: probe-with-initial-tool-cool (stock: M104 S0 T0)
    M400

    SAVE_VARIABLE VARIABLE=box_modify_t0  value={t}
    T{INITIAL_TOOL}
    SET_GCODE_OFFSET X=0.0 Y=0.0 Z=0.0 MOVE=1
    G90
    # SET_GCODE_OFFSET Z=0.145 MOVE=0
    G1 Z7.0 F3000                    # Move Z Axis up
    # >>> wondermaker+ begin: left-edge-purge (original, re-applied on 1.1.04 2026-08-19)
    # Why: the stock purge line at the bed FRONT (Y-1) causes toolhead-shroud-
    # vs-front-panel strikes and shifted prints (root cause proven by in-vivo
    # stepper-counter checkpoints). Purge on the plate's left edge (X0, outside
    # the printable area) for the same on-bed priming drag with zero front-
    # geometry exposure and zero printable-area cost. Same 50mm / E20 / F1000.
    G1 X0.0 Y70.0 F10000.0
    M109 S{EXTRUDER} T{INITIAL_TOOL}
    G1 Y100.0 F5000.0
    G1 Z0.4 F5000.0
    G1 Y150.0 E20 F1000.0
    G91
    G1 Z5 X5 F600
    G90
    # <<< wondermaker+ end: left-edge-purge (stock: G1 X50 Y-1 ... X170 E20)

    T{INITIAL_TOOL} 
    # >>> wondermaker+ begin: print-mesh-context-commit
    _WMP_PRINT_CONTEXT_COMMIT
    # <<< wondermaker+ end: print-mesh-context-commit
    SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=adaptive_mesh_enable VALUE={True}
    SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=print_body_ready VALUE=True
    M118 START_PRINT finished

[gcode_macro PRINT_END]            # Set PRINT_END as the end-of-print macro to customise the after-print action.
gcode:
    # >>> wondermaker+ begin: print-mesh-context-clear
    _WMP_PRINT_CONTEXT_CLEAR
    # <<< wondermaker+ end: print-mesh-context-clear
    {% set RUN_VELOCITY = printer.configfile.settings['printer'].max_velocity|float %}
    {% set RUN_ACCEL    = printer.configfile.settings['printer'].max_accel|float %}
    SET_VELOCITY_LIMIT VELOCITY={RUN_VELOCITY} ACCEL={RUN_ACCEL} #ACCEL_TO_DECEL={RUN_DECEL}
    M220 S100
    M400                           

    {% if "z" in printer.toolhead.homed_axes %}
        {% set z_max = printer.configfile.settings.stepper_z.position_endstop|int %}
        {% set current_z = printer.gcode_move.position.z|int %}
        G90
        {% if (current_z+10) < z_max %}
            G1 Z{current_z+10} F6000
        {% else %}
            G1 Z{z_max} F6000
        {% endif %}
    {% endif %}
    
    {% if "xy" in printer.toolhead.homed_axes %}
        G0 Y240 F12000
        G0 X-13 F12000
    {% endif %}

    TURN_OFF_HEATERS             # Close the hot end
    M107                           # Switch off the fan.
    G90                            # absolute positioning
    BED_MESH_CLEAR               # Unloading net beds
    SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=adaptive_mesh VALUE=0
    SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=print_body_ready VALUE=False
    M84
    RESET_FLOW_EXTRUDER
    SDCARD_RESET_FILE
    SAVE_VARIABLE VARIABLE=box_modify_t0 VALUE=0
    SAVE_VARIABLE VARIABLE=box_modify_t1 VALUE=1
    SAVE_VARIABLE VARIABLE=box_modify_t2 VALUE=2
    SAVE_VARIABLE VARIABLE=box_modify_t3 VALUE=3
    # >>> wondermaker+ begin: probe-with-initial-tool-reset
    SAVE_VARIABLE VARIABLE=probe_tool VALUE=0
    # <<< wondermaker+ end: probe-with-initial-tool-reset
    

[gcode_macro E_axis_move]
gcode:
    {% set len = params.L|default(0)|int %}
    {% set speed = params.S|default(10000)|int %}
    G91
    M83
    {% if printer[printer.toolhead.extruder].temperature >= printer.configfile.settings.extruder.min_extrude_temp %} 
        G1 E{len} F{speed}
        M118 G1 E{len} F{speed}
    {% endif %}
    G90




[gcode_macro PAUSE]
rename_existing: BASE_PAUSE
gcode:
    SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout}
    {% set thr_number = printer.save_variables.variables.thr_number|int %}
    {% set x_park = params.X|default(150)|int %}
    # >>> wondermaker+ begin: pause-park-margin (original, re-applied on 1.1.04 2026-08-19)
    # Why: stock parks at Y1 — one millimetre from the front hard stop; any
    # pre-existing position error turns that into a frame strike + lost Y
    # steps. Y20 keeps the head at the front for filament access with margin.
    {% set y_park = params.Y|default(20)|int %}
    # <<< wondermaker+ end: pause-park-margin (stock default: Y1)
    {% if thr_number == 1 %}
        {% set current_temp0 = printer.extruder.target %}
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=resume_temperature0 VALUE={current_temp0}
    {% elif thr_number == 2 %}
        {% set current_temp0 = printer.extruder.target %}
        {% set current_temp1 = printer.extruder1.target %}
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=resume_temperature0 VALUE={current_temp0}
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=resume_temperature1 VALUE={current_temp1}
    {% elif thr_number == 3 %}
        {% set current_temp0 = printer.extruder.target %}
        {% set current_temp1 = printer.extruder1.target %}
        {% set current_temp2 = printer.extruder2.target %}
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=resume_temperature0 VALUE={current_temp0}
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=resume_temperature1 VALUE={current_temp1}
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=resume_temperature2 VALUE={current_temp2}
    {% elif thr_number == 4 %}
        {% set current_temp0 = printer.extruder.target %}
        {% set current_temp1 = printer.extruder1.target %}
        {% set current_temp2 = printer.extruder2.target %}
        {% set current_temp3 = printer.extruder3.target %}
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=resume_temperature0 VALUE={current_temp0}
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=resume_temperature1 VALUE={current_temp1}
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=resume_temperature2 VALUE={current_temp2}
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=resume_temperature3 VALUE={current_temp3}
    {% endif %}
    {% set current_bed = printer["heater_bed"].temperature %}
    {% set z = params.Z|default(10)|int %}                                                   
    {% set e = params.E|default(2.5) %} 
    
    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=fan VALUE={printer["fan"].speed*255}
    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=afan VALUE={printer["fan_generic auxiliary_fan"].speed*255}
    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=resume_bed VALUE={current_bed}
    {% if 'fan_generic air_fan' in printer %}
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=airfan VALUE={printer["fan_generic air_fan"].speed*255}
    {% endif %}

    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=zhop VALUE={z}                             
    SAVE_GCODE_STATE NAME=PAUSE                                                                  
    M25                                                                              
    {% if (printer.gcode_move.position.z + z) < printer.toolhead.axis_maximum.z %}       
        E_axis_move L=-{e} S={2100}
        G91
        G1 Z{z} F900
        G90
        G1 X{x_park} Y{y_park} F6000                                                                     
    {% else %}
        E_axis_move L=-{e} S={2100}
        G1 X{x_park} Y{y_park} F6000  
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=zhop VALUE=0
    {% endif %}
    SAVE_GCODE_STATE NAME=PAUSEPARK
    G90
    E_axis_move L={e} S={2100}     
    
    # >>> wondermaker+ begin: pause-mapping-snapshot (original, re-applied on 1.1.04 2026-08-19)
    # Why: PAUSE resets the tool mapping (box_modify_t*) to identity below, and
    # RESUME restores it from box_modify_t*_backup — but on a Fluidd/Moonraker
    # resume nothing else populates those backups, so a stale mapping loaded
    # the wrong tool. Snapshot the live mapping into the backups here first.
    # (The touchscreen's own resume path overwrites these afterward, so its
    # spool-remap flow still wins — this only fixes the API-resume default.)
    {% set b0 = printer.save_variables.variables.box_modify_t0|int %}
    {% set b1 = printer.save_variables.variables.box_modify_t1|int %}
    {% set b2 = printer.save_variables.variables.box_modify_t2|int %}
    {% set b3 = printer.save_variables.variables.box_modify_t3|int %}
    SAVE_VARIABLE VARIABLE=box_modify_t0_backup VALUE={b0}
    SAVE_VARIABLE VARIABLE=box_modify_t1_backup VALUE={b1}
    SAVE_VARIABLE VARIABLE=box_modify_t2_backup VALUE={b2}
    SAVE_VARIABLE VARIABLE=box_modify_t3_backup VALUE={b3}
    # <<< wondermaker+ end: pause-mapping-snapshot
    # 先恢复恒等映射再关加热，避免 remapped 时 M104 Tx 漏关/错关物理头
    SAVE_VARIABLE VARIABLE=box_modify_t0 VALUE=0
    SAVE_VARIABLE VARIABLE=box_modify_t1 VALUE=1
    SAVE_VARIABLE VARIABLE=box_modify_t2 VALUE=2
    SAVE_VARIABLE VARIABLE=box_modify_t3 VALUE=3
    {% for i in range(thr_number) %}
        M104 S0 T{i}
    {% endfor %}
    M106 S0
    M106 P2 S0
    SET_STEPPER_ENABLE STEPPER={printer.toolhead.extruder} ENABLE=0


[gcode_macro RESUME]
rename_existing: BASE_RESUME
variable_resume_temperature0: 240
variable_resume_temperature1: 240
variable_resume_temperature2: 240
variable_resume_temperature3: 240
variable_resume_bed: 60
variable_zhop: 0
variable_etemp: 0
variable_fan:0.0
variable_afan: 0.0
variable_airfan: 0.0
gcode:
    {% set thr_number = printer.save_variables.variables.thr_number|int %}
    M118 resume_temperature0 = {resume_temperature0}
    M118 resume_temperature1 = {resume_temperature1}
    M118 resume_temperature2 = {resume_temperature2}
    M118 resume_temperature3 = {resume_temperature3}
    {% if printer['heater_bed'].target < resume_bed %} 
        M190 S{resume_bed} 
    {% endif %}

    {% if thr_number == 1 %}
        M104 S{resume_temperature0} T0
        M109 S{resume_temperature0} T0
    {% elif thr_number == 2 %}
        M104 S{resume_temperature0} T0
        M104 S{resume_temperature1} T1
        M109 S{resume_temperature0} T0
        M109 S{resume_temperature1} T1
    {% elif thr_number == 3 %}
        M104 S{resume_temperature0} T0
        M104 S{resume_temperature1} T1
        M104 S{resume_temperature2} T2
        M109 S{resume_temperature0} T0
        M109 S{resume_temperature1} T1
        M109 S{resume_temperature2} T2
    {% elif thr_number == 4 %}
        M104 S{resume_temperature0} T0
        M104 S{resume_temperature1} T1
        M104 S{resume_temperature2} T2
        M104 S{resume_temperature3} T3
        M109 S{resume_temperature0} T0
        M109 S{resume_temperature1} T1
        M109 S{resume_temperature2} T2
        M109 S{resume_temperature3} T3
    {% endif %}

    # 恢复温度后再恢复映射
    {% set value0 = printer.save_variables.variables.box_modify_t0_backup %}
    {% set value1 = printer.save_variables.variables.box_modify_t1_backup %}
    {% set value2 = printer.save_variables.variables.box_modify_t2_backup %}
    {% set value3 = printer.save_variables.variables.box_modify_t3_backup %}
    SAVE_VARIABLE VARIABLE=box_modify_t0 VALUE={value0}
    SAVE_VARIABLE VARIABLE=box_modify_t1 VALUE={value1}
    SAVE_VARIABLE VARIABLE=box_modify_t2 VALUE={value2}
    SAVE_VARIABLE VARIABLE=box_modify_t3 VALUE={value3}

    {% set e = params.E|default(2.5)|int %}
    SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout}
    E_axis_move L=-{e} S=900
    # RESTORE_GCODE_STATE NAME=PAUSEPARK MOVE=1 MOVE_SPEED=100

    WIPE_NOZZLE
    G0 Y200 F12000
    M400
    M106 S{fan}
    M106 P2 S{afan}
    M106 P3 S{airfan}
    RESTORE_GCODE_STATE NAME=PAUSE MOVE=1 MOVE_SPEED=60 
    M24


[gcode_macro CANCEL_PRINT]
variable_runout_detected: 0
rename_existing: BASE_CANCEL_PRINT
gcode:
    # >>> wondermaker+ begin: print-mesh-context-clear
    _WMP_PRINT_CONTEXT_CLEAR
    # <<< wondermaker+ end: print-mesh-context-clear
    {% set RUN_VELOCITY = printer.configfile.settings['printer'].max_velocity|float %}
    {% set RUN_ACCEL    = printer.configfile.settings['printer'].max_accel|float %}
    SET_VELOCITY_LIMIT VELOCITY={RUN_VELOCITY} ACCEL={RUN_ACCEL}
    M220 S100
    SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout} 
    M400                                        ; wait for buffer to clear
    G92 E0                                    ; zero the extruder
    {% if printer.save_variables.variables.current_extruder == 0 %} 
     {% set current_temp = printer['extruder'].target %}
    {% endif %}
    {% if printer.save_variables.variables.current_extruder == 1 %} 
      {% set current_temp = printer['extruder1'].target %}
    {% endif %}
    {% if printer.save_variables.variables.current_extruder == 2 %} 
     {% set current_temp = printer['extruder2'].target %}
    {% endif %}
    {% if printer.save_variables.variables.current_extruder == 3 %} 
      {% set current_temp = printer['extruder3'].target %}
    {% endif %}
    E_axis_move L=-1 S=1200
    TURN_OFF_HEATERS
    M107                                        ; turn off fan
    # >>> wondermaker+ begin: probe-with-initial-tool-reset
    SAVE_VARIABLE VARIABLE=probe_tool VALUE=0
    # <<< wondermaker+ end: probe-with-initial-tool-reset

    {% if "z" in printer.toolhead.homed_axes %}
        {% set z_max = printer.configfile.settings.stepper_z.position_endstop|int %}
        {% set current_z = printer.gcode_move.position.z|int %}
        G90
        {% if (current_z+10) < z_max %}
            G1 Z{current_z+10} F6000
        {% else %}
            G1 Z{z_max} F6000
        {% endif %}
    {% endif %}

    {% if "xy" in printer.toolhead.homed_axes %}
        G0 Y240 F12000
        G0 X-13 F12000
    {% endif %}
    # PARK_CURRENT_TOOL
    BED_MESH_CLEAR
    SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=adaptive_mesh VALUE=0
    M84
    RESET_FLOW_EXTRUDER
    SAVE_VARIABLE VARIABLE=box_modify_t0 VALUE=0
    SAVE_VARIABLE VARIABLE=box_modify_t1 VALUE=1
    SAVE_VARIABLE VARIABLE=box_modify_t2 VALUE=2
    SAVE_VARIABLE VARIABLE=box_modify_t3 VALUE=3
    SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=print_body_ready VALUE=False
    SDCARD_RESET_FILE


[gcode_macro PROBE_CALIBRATE]
description: Z偏移校准，请先开启热床预热
rename_existing: PROBE_CALIBRATE_BASE
gcode:
    BED_MESH_CLEAR
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    # >>> wondermaker+ begin: probe-calibrate-clearance
    # A separate macro evaluates the position after any G28 completes.
    _WMP_CALIBRATION_CLEARANCE
    # <<< wondermaker+ end: probe-calibrate-clearance
    G1 X150 Y150 F3000
    PROBE_CALIBRATE_BASE

[gcode_macro G29]
variable_bed_leveling: False
gcode:
    # >>> wondermaker+ begin: print-mesh-context-clear
    _WMP_PRINT_CONTEXT_CLEAR
    # <<< wondermaker+ end: print-mesh-context-clear
    SET_GCODE_VARIABLE MACRO=G29 VARIABLE=bed_leveling VALUE={True}
    # >>> wondermaker+ begin: probe-with-initial-tool-reset
    # The default mesh is a T0 datum.
    SAVE_VARIABLE VARIABLE=probe_tool VALUE=0
    # <<< wondermaker+ end: probe-with-initial-tool-reset
    G28 X Y
    M400
    M140 S55
    # 保存当前工具状态
    {% set original_tool = printer.save_variables.variables.current_extruder|default(-1)|int %}
    
    # 检查并确保T0挤出头已抓取
    {% if original_tool != 0 %}
        M118 T0 extruder not grabbed, grabbing now...
        # >>> wondermaker+ begin: default-mesh-physical-tool
        _CHANGE_TOOL T=0        # The default mesh uses physical T0, not a remapped slot.
        # <<< wondermaker+ end: default-mesh-physical-tool
        # G28                    # 归位
    {% else %}
        M118 T0 extruder already grabbed
    {% endif %}

    {% if "xy" not in printer.toolhead.homed_axes %}
        G28 Z
    {% endif %}
    G1 X150 Y135 F3000
    M104 S140            # 设置喷嘴目标温度为140度（不等待）
    # G28  Z
       
    M118 The bed and nozzle are heating up
    M190 S55
    M109 S140            # 设置喷嘴温度为140度，并等待达到温度（阻塞等待）
    WIPE_NOZZLE 
    M118 49-point calibration is in progress
    BED_MESH_CALIBRATE
    M104 S0              # 关闭喷嘴加热，设置为0℃
    M118 Calibration completed, nozzle cooling down
    SET_GCODE_VARIABLE MACRO=G29 VARIABLE=bed_leveling VALUE={False}
  
[gcode_macro G30]
gcode:
       SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=adaptive_mesh_enable VALUE={True}

[gcode_macro G31]
gcode:
       SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=adaptive_mesh_enable VALUE={False}

# >>> wondermaker+ begin: probe-with-initial-tool-controls (ours, 2026-08-30)
[gcode_macro PROBE_WITH_INITIAL_TOOL]
description: ENABLE=1|0 - persistently enable/disable homing/meshing with the print's first tool instead of T0 (default enabled). No parameter: report.
gcode:
    {% set svv = printer.save_variables.variables %}
    {% if params.ENABLE is defined %}
        SAVE_VARIABLE VARIABLE=probe_with_initial_tool VALUE={True if params.ENABLE|int else False}
    {% endif %}
    M118 probe_with_initial_tool={svv.probe_with_initial_tool|default(True)} probe_tool={svv.probe_tool|default(0)}

# Return to the T0 datum on every Klipper start (START_PRINT sets probe_tool per print).
[delayed_gcode _probe_tool_startup_reset]
initial_duration: 2
gcode:
    {% if printer.save_variables.variables.probe_tool|default(0)|int != 0 and not printer['gcode_macro _WMP_RECOVERY_BEGIN'].active %}
        SAVE_VARIABLE VARIABLE=probe_tool VALUE=0
    {% endif %}
# <<< wondermaker+ end: probe-with-initial-tool-controls

# >>> wondermaker+ begin: print-mesh-recovery-context
# wmp_print is a private, persistent snapshot. It never replaces default.
# The context is committed only after startup/purge completes and survives
# the ordinary probe_tool reset on restart. Version 1.1.08 signals recovery
# homing with Z_HOMING.z_raise=0; see docs/print-mesh-recovery.md.
[gcode_macro _WMP_PRINT_CONTEXT_CLEAR]
gcode:
    SAVE_VARIABLE VARIABLE=wmp_print_context VALUE="{ {} }"
    SET_GCODE_VARIABLE MACRO=_WMP_RECOVERY_BEGIN VARIABLE=active VALUE=False

[gcode_macro _WMP_PRINT_CONTEXT_COMMIT]
gcode:
    {% set sv = printer.save_variables.variables %}
    {% set offsets = [sv.t0_offset, sv.t1_offset, sv.t2_offset, sv.t3_offset] %}
    # Encode filenames so G-code comment characters and ConfigParser percent
    # interpolation cannot corrupt a saved-variable command or its file.
    {% set mapping = [sv.box_modify_t0, sv.box_modify_t1, sv.box_modify_t2, sv.box_modify_t3] %}
    {% set context = {'version': 2, 'tool': sv.probe_tool|int, 'offsets': offsets, 'mapping': mapping,
                      'file_hex': printer.print_stats.filename.encode('utf-8').hex(), 'mesh': 'wmp_print'} %}
    {% if printer.bed_mesh.profile_name != 'wmp_print' %}
        {action_raise_error('Print recovery mesh was not saved; startup stopped')}
    {% endif %}
    SAVE_VARIABLE VARIABLE=wmp_print_context VALUE="{context|string|replace('\\', '\\\\')|replace('"', '\\"')}"

[gcode_macro _WMP_RECOVERY_BEGIN]
variable_active: False
gcode:
    {% set sv = printer.save_variables.variables %}
    {% set context = sv.wmp_print_context|default({}) %}
    {% set offsets = [sv.t0_offset, sv.t1_offset, sv.t2_offset, sv.t3_offset] %}
    {% set mapping = context.mapping|default([]) %}
    {% if context.version|default(0) != 2 or context.tool|default(-1) not in [0,1,2,3]
          or context.mesh|default('') != 'wmp_print' or 'wmp_print' not in printer.bed_mesh.profiles
          or context.offsets|default([]) != offsets or not context.file_hex|default('')
          or mapping|length != 4 or mapping|reject('in', [0,1,2,3])|list|length != 0 %}
        # The touchscreen submits more movement commands after a failed G28.
        # Shutdown prevents those commands from continuing with a guessed datum.
        {action_emergency_stop('Power-loss recovery has no matching W+ mesh/tool context; start a new print')}
        {action_raise_error('Power-loss recovery context is missing or calibration changed')}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_WMP_RECOVERY_BEGIN VARIABLE=active VALUE=True
    SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=print_body_ready VALUE=False
    SAVE_VARIABLE VARIABLE=probe_tool VALUE={context.tool}

[gcode_macro _WMP_RECOVERY_RESTORE_MESH]
gcode:
    BED_MESH_PROFILE_BASE LOAD=wmp_print

[gcode_macro BED_MESH_PROFILE]
rename_existing: BED_MESH_PROFILE_BASE
gcode:
    {% set recovering = printer['gcode_macro _WMP_RECOVERY_BEGIN'].active %}
    {% set probe_tool = printer.save_variables.variables.probe_tool|default(0)|int %}
    {% if recovering and params.LOAD is defined %}
        # Vendor PLR chooses default/adaptive_mesh; both resolve to the exact
        # per-print snapshot, already restored immediately after recovery G28.
        BED_MESH_PROFILE_BASE LOAD=wmp_print
    {% elif params.LOAD|default('') == 'default' and probe_tool != 0 %}
        {action_raise_error('Default mesh requires the T0 probing reference; start with G31 or calibrate with G29')}
    {% elif params.LOAD|default('') == 'wmp_print' or params.SAVE|default('') == 'wmp_print' or params.REMOVE|default('') == 'wmp_print' %}
        {action_raise_error('wmp_print is reserved for START_PRINT and power-loss recovery')}
    {% else %}
        BED_MESH_PROFILE_BASE {rawparams}
    {% endif %}

[gcode_macro M24]
rename_existing: M9924
gcode:
    {% set sv = printer.save_variables.variables %}
    {% set context = sv.wmp_print_context|default({}) %}
    {% if printer['gcode_macro _WMP_RECOVERY_BEGIN'].active %}
        {% set mapping = context.mapping|default([]) %}
        {% if printer.print_stats.filename.encode('utf-8').hex() != context.file_hex|default('') or
              printer.bed_mesh.profile_name != 'wmp_print' or
              sv.probe_tool|int != context.tool|default(-1) or
              context.version|default(0) != 2 or mapping|length != 4 or
              mapping|reject('in', [0,1,2,3])|list|length != 0 %}
            {action_emergency_stop('Power-loss recovery file/mesh/tool does not match the saved print')}
            {action_raise_error('Power-loss recovery context mismatch')}
        {% endif %}
        # The 1.1.08 client restores identity mappings during recovery even
        # when this print used remapped tools. Wait until its last tool/heater
        # setup is finished, then restore the print mapping before SD execution.
        {% for physical in mapping %}
            SAVE_VARIABLE VARIABLE=box_modify_t{loop.index0} VALUE={physical}
            SAVE_VARIABLE VARIABLE=box_modify_t{loop.index0}_backup VALUE={physical}
        {% endfor %}
        SET_GCODE_VARIABLE MACRO=_WMP_RECOVERY_BEGIN VARIABLE=active VALUE=False
    {% elif context.version|default(0) == 2 and context.file_hex|default('') == printer.print_stats.filename.encode('utf-8').hex() %}
        # Ordinary RESUME may accept an intentional spool remap. Save the live
        # mapping after RESUME restores it, so a later power cut retains it.
        {% set mapping = [sv.box_modify_t0, sv.box_modify_t1, sv.box_modify_t2, sv.box_modify_t3] %}
        {% if mapping != context.mapping %}
            {% set updated = dict(context, mapping=mapping) %}
            SAVE_VARIABLE VARIABLE=wmp_print_context VALUE="{updated|string|replace('\\', '\\\\')|replace('"', '\\"')}"
        {% endif %}
    {% endif %}
    M9924 {rawparams}
# <<< wondermaker+ end: print-mesh-recovery-context


[gcode_macro BED_MESH_CALIBRATE]
rename_existing: BED_MESH_CALIBRATE_BASE
gcode:
    # >>> wondermaker+ begin: default-mesh-reference-guard
    {% if params.PROFILE|default('default') == 'default' and printer.save_variables.variables.probe_tool|default(0)|int != 0 %}
        {action_raise_error('Calibrate default with the T0 reference using G29; use a named profile for another reference')}
    {% endif %}
    # <<< wondermaker+ end: default-mesh-reference-guard
    {%if params.MESH_MIN is defined %}
        {% set START_POINT = params.MESH_MIN.split(',') %}
        {% set START_POINT_X = START_POINT[0]|float %}
        {% set START_POINT_Y = START_POINT[1]|float %}
    {% else %}
        {% set START_POINT_X = printer.configfile.settings.bed_mesh.mesh_min[0]|float %}
        {% set START_POINT_Y = printer.configfile.settings.bed_mesh.mesh_min[1]|float %}
    {% endif %}

    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% else %} 
    {% endif %}
    G90 
    G1 Z7 F15000
    G1 Y{START_POINT_Y} F15000
    G1 X{START_POINT_X} F15000
    BED_MESH_CALIBRATE_BASE {rawparams}

[gcode_macro _START_PROBE]
variable_bed_temp = 0
gcode = 
	{% set PROBE_TEMP = 0 %}
	{% set MAX_TEMP = PROBE_TEMP + 5 %}
	{% set ACTUAL_TEMP = printer.extruder.temperature %}
	{% set TARGET_TEMP = printer.extruder.target %}
	# SET_GCODE_VARIABLE MACRO=START_PROBE VARIABLE=bed_temp VALUE={printer.heater_bed.target}
	# SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET=0
	
	{% if TARGET_TEMP > PROBE_TEMP %}
        { action_respond_info('Extruder temperature target of %.1fC is too high, lowering to %.1fC' % (TARGET_TEMP, PROBE_TEMP)) }
        M106 S255
        M104 S0
        {% if ACTUAL_TEMP > MAX_TEMP %}
            { action_respond_info('Extruder temperature %.1fC is still too high, waiting until below %.1fC' % (ACTUAL_TEMP, MAX_TEMP)) }
            TEMPERATURE_WAIT SENSOR=extruder MAXIMUM=49
        {% endif %}
            M106 S0
            G4 P1000
    {% endif %}
    

[gcode_macro M109]
rename_existing = M99109
gcode = 
    {% set s = params.S|default(0)|float %}
    {% if 'T' in params %}
        {% set T = params.T|int %}
        {% if T == 0 %}
            {% set t = printer.save_variables.variables.box_modify_t0|int %}
        {% elif T == 1 %}
            {% set t = printer.save_variables.variables.box_modify_t1|int %}
        {% elif T == 2 %}
            {% set t = printer.save_variables.variables.box_modify_t2|int %}
        {% elif T == 3 %}
            {% set t = printer.save_variables.variables.box_modify_t3|int %}
        {% else %}
            {% set t = T %}
        {% endif %}
    {% else %}
        {% set active = printer.toolhead.extruder %}
        {% set t = 0 if active == 'extruder' else active|replace('extruder','')|int %}
    {% endif %}
    {% set heater = 'extruder' if t == 0 else 'extruder' ~ t %}
    SET_HEATER_TEMPERATURE HEATER={heater} TARGET={s}
    {% if s > 0 %}
        TEMPERATURE_WAIT SENSOR={heater} MINIMUM={s-2.5} MAXIMUM={s+2.5}
    {% endif %}
	


[gcode_macro M104]
rename_existing = M99104
gcode = 
    {% set s = params.S|default(0)|float %}
    {% if 'T' in params %}
        {% set T = params.T|int %}
        {% if T == 0 %}
            {% set t = printer.save_variables.variables.box_modify_t0|int %}
        {% elif T == 1 %}
            {% set t = printer.save_variables.variables.box_modify_t1|int %}
        {% elif T == 2 %}
            {% set t = printer.save_variables.variables.box_modify_t2|int %}
        {% elif T == 3 %}
            {% set t = printer.save_variables.variables.box_modify_t3|int %}
        {% else %}
            {% set t = T %}
        {% endif %}
    {% else %}
        {% set active = printer.toolhead.extruder %}
        {% set t = 0 if active == 'extruder' else active|replace('extruder','')|int %}
    {% endif %}
    {% if t == 0 %}
        SET_HEATER_TEMPERATURE HEATER=extruder TARGET={s}
    {% else %}
        SET_HEATER_TEMPERATURE HEATER=extruder{t} TARGET={s}
    {% endif %}
	

[gcode_macro M190]
rename_existing = M99190
gcode = 
	
	{% set s = params.S|float %}
	
	M140 {% for p in params %}{'%s%s' % (p, params[p])}{% endfor %}
	{% if s != 0 %}
	TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={s-1} MAXIMUM={s+1}
	{% endif %}

[gcode_macro M106]
rename_existing = M99106
gcode = 
	{% set s = (params.S|default(0)|int) %}
	{% set speed = s / 255 %}
    {% set p = params.P|default(0)|int %}

    {% if p == 0 %}
        M99106 S{s}
    {% elif p == 2 %}
        SET_FAN_SPEED FAN=auxiliary_fan SPEED={speed}
    {% elif p == 3 and 'fan_generic air_fan' in printer %}
        SET_FAN_SPEED FAN=air_fan SPEED={speed}
    {% endif %}

[gcode_macro M107]    #增加关闭所有风扇宏M107,在取消打印和结束打印要用到
