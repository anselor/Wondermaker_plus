    {% endif %}
    {% if 'xyz' not in printer.toolhead.homed_axes %}
        { action_raise_error('Home XYZ before loading or unloading filament: toolhead.homed_axes=%s; expected xyz' % printer.toolhead.homed_axes) }
    {% endif %}
    {% set available = printer.toolhead.axis_maximum.z|float - printer.toolhead.position.z|float %}
    {% set lift = [hop|float, available]|min %}
    G91
    {% if lift > 0 %}
        G1 Z{lift} F800
    {% endif %}
    G90
    G1 X{x} F6000
    G1 Y{y} F6000
# <<< wondermaker+ end: filament-service-clearance

# >>> wondermaker+ begin: print-end-clearance-and-wipe
# Stock lowers the bed only 10 mm and parks at the brush without wiping.
# Compute the available physical travel so G-code/tool/mesh offsets cannot
# make the requested drop cross the bottom Z endstop coordinate.
[gcode_macro _WMP_PRINT_LOWER_BED]
description: Lower a homed bed after a stopped print, bounded by the bottom endstop.
gcode:
    {% set bed_drop = [0.0, printer['gcode_macro PRINT_END'].bed_drop|float]|max %}
    {% if "z" in printer.toolhead.homed_axes %}
        {% set z_limit = printer.configfile.settings.stepper_z.position_endstop|float %}
        {% set physical_z = printer.toolhead.position.z|float %}
        {% set available_drop = [0.0, z_limit - physical_z]|max %}
        {% set safe_drop = [bed_drop|float, available_drop]|min %}
        {% set target_z = printer.gcode_move.gcode_position.z|float + safe_drop %}
        SAVE_GCODE_STATE NAME=wmp_print_lower_bed
        G90
        {% if safe_drop > 0 %}
            G1 Z{target_z} F3000
        {% endif %}
        RESTORE_GCODE_STATE NAME=wmp_print_lower_bed MOVE=0
    {% endif %}

[gcode_macro _WMP_PRINT_END_CLEARANCE_AND_WIPE]
gcode:
    _WMP_PRINT_LOWER_BED
    {% if "xyz" in printer.toolhead.homed_axes %}
        WIPE_NOZZLE
    {% endif %}
# <<< wondermaker+ end: print-end-clearance-and-wipe

# >>> wondermaker+ begin: manual-extruder-step
[gcode_macro WMP_EXTRUDER_STEP]
description: Move only the active physical extruder by MM (signed, maximum 50); no heat, homing, pickup or parking.
gcode:
    {% set head = params.HEAD|default(-1)|int %}
    {% set mm = params.MM|default(0)|float %}
    {% set physical = 'extruder' if head == 0 else 'extruder%d' % head %}
    {% if 'openace' in printer %}
        { action_raise_error('openACE owns filament operations; use its manual operation command') }
    {% endif %}
    {% if head < 0 or head > 3 or physical not in printer %}
        { action_raise_error('Select an installed physical head: HEAD=%d (expected 0..3), heater %s present=%s' % (head, physical, physical in printer)) }
    {% endif %}
    {% if not (mm >= -50 and mm <= 50) or mm == 0 %}
        { action_raise_error('MM must be a nonzero distance between -50 and 50: received %s' % mm) }
    {% endif %}
    {% if printer.print_stats.state not in ['standby', 'complete', 'cancelled', 'paused'] %}
        { action_raise_error('Manual extrusion requires an idle or paused printer: print_stats.state=%s' % printer.print_stats.state) }
    {% endif %}
    {% if printer.toolhead.extruder != physical and printer.print_stats.state == 'paused' %}
        { action_raise_error('Active extruder differs from the mounted head during a paused print: toolhead.extruder=%s, requested=%s' % (printer.toolhead.extruder, physical)) }
    {% endif %}
    {% if 'wm_material' in printer and printer.wm_material.attachment is defined %}
        # A standalone unknown receipt is historical, not an executing worker.
        # Permit deliberate manual repair after the physical checks below.
        {% set operation_state = printer.wm_material.filament_operation.state|default('') %}
        {% if operation_state in ['pending', 'running'] or (operation_state == 'unknown' and 'AFC' in printer) %}
            { action_raise_error('Finish the filament operation before extruding: wm_material.filament_operation.state=%s' % operation_state) }
        {% endif %}
        {% if printer.wm_material.attachment.state != 'attached' or printer.wm_material.attachment.head != 'h%d' % head %}
            { action_raise_error('Selected head attachment is not confirmed: attachment.state=%s, attachment.head=%s; expected attached/h%d' % (printer.wm_material.attachment.state|default('missing'), printer.wm_material.attachment.head|default('missing'), head)) }
        {% endif %}
    {% elif printer.save_variables.variables.current_extruder|default(-1)|int != head
          or not (printer.custom_hall.Raw >= 3450 and printer.custom_hall.Raw < 4700)
          or not printer['filament_switch_sensor sensor_b'].filament_detected
          or printer['filament_switch_sensor docked%d' % head].filament_detected %}
        { action_raise_error('Selected head attachment is not confirmed: current_extruder=%d (expected %d), hall=%.1f (expected 3450<=hall<4700), sensor_b=%s (expected True), docked%d=%s (expected False)' % (printer.save_variables.variables.current_extruder|default(-1)|int, head, printer.custom_hall.Raw, printer['filament_switch_sensor sensor_b'].filament_detected, head, printer['filament_switch_sensor docked%d' % head].filament_detected)) }
    {% endif %}
    {% if not printer[physical].can_extrude %}
        { action_raise_error('Heat the selected nozzle before extruding or retracting: %s.can_extrude=False' % physical) }
    {% endif %}
    # Do not change flow here: vendor RESTORE_GCODE_STATE does not restore
    # base_position. Compensate the commanded distance/speed instead.
    {% set flow = printer.gcode_move.extrude_factor|float %}
    {% set speed = printer.gcode_move.speed_factor|float %}
    {% if not (flow > 0 and flow <= 10 and speed > 0 and speed <= 10) %}
        { action_raise_error('Invalid speed or extrusion override: extrude_factor=%s, speed_factor=%s; each must be >0 and <=10' % (flow, speed)) }
    {% endif %}
    # A manual move invalidates the previous operator check. Do not keep
    # claiming filament reaches the nozzle after a retract.
    {% if 'wm_material' in printer and printer.wm_material.filament_check_protocol|default(0)|int == 1 %}
        WMP_FORGET_FILAMENT HEAD={head}
    {% endif %}
    # Restart resets Klipper's logical selection even if a head stays mounted.
    # All attachment and temperature checks above must pass before selecting it.
    {% if printer.toolhead.extruder != physical %}
        ACTIVATE_EXTRUDER EXTRUDER={physical}
    {% endif %}
    SAVE_GCODE_STATE NAME=WMP_MANUAL_STEP
    M83
    G1 E{mm / flow} F{300 / speed}
    M400
    RESTORE_GCODE_STATE NAME=WMP_MANUAL_STEP MOVE=0
# <<< wondermaker+ end: manual-extruder-step

[gcode_macro EXTRUDE_FILAMENT]
description: Deliberate managed load on the currently selected physical extruder.
gcode:
    {% set active = printer.toolhead.extruder %}
    {% set head = ['extruder', 'extruder1', 'extruder2', 'extruder3'].index(active) if active in ['extruder', 'extruder1', 'extruder2', 'extruder3'] else -1 %}
    {% if 'wm_material' not in printer or 'openace' in printer or 'AFC' in printer or head < 0 %}
        { action_raise_error('Legacy filament service requires a current standalone physical head') }
    {% endif %}
    {% for key in params %}
        {% if key not in ['T', 'ID'] %}
            { action_raise_error('Unsupported filament service parameter: %s' % key) }
        {% endif %}
    {% endfor %}
    {% if 'T' in params %}
        {% if params.T not in ['0', '1', '2', '3'] or printer.save_variables.variables.get('box_modify_t' ~ params.T) != head %}
            { action_raise_error('EXTRUDE_FILAMENT T heater mapping differs from the active physical head; select the intended head first') }
        {% endif %}
    {% endif %}
    WMP_FILAMENT_SERVICE ACTION=load HEAD={head} {% if 'ID' in params %}ID={params.ID}{% endif %}

# >>> wondermaker+ begin: u1-tip-shaping (ported from Snapmaker U1 fw 1.6.0 CONTROL_RETRACT_ACTION, 2026-08-29)
# Why: stock unload leaves a blobbed, stringy tip. Sequences from Snapmaker
# U1 1.6.0 (pla/abs/soft) and Prusa PrusaResearch.ini *PETPG* (petg), chosen
# by material class. Net retraction -110 mm PLA, -27 PETG, -57 ABS/soft. Details:
# config/README.md "u1-tip-shaping".
[gcode_macro _TIP_SHAPE_RETRACT]
description: Shape the unload tip. MATERIAL= selects material; CLASS=pla|abs|soft|petg runs moves directly at the prepared temperature.
variable_result: 'pla'
# Optional invocation-scoped evidence, commanded E only.
variable_openace_phase_version: 1
variable_openace_phase_report: {}
variable_source: 'default'
variable_material: ''
variable_slot: 0
# Unload temperature per material (U1 table; PETG/PET per test: cooler is
# better). unload_temp_min: floor for unlisted materials, 0 disables.
# TEMP_MIN= overrides per call.
variable_unload_temp_min: 250
variable_unload_temps: {'PLA': 250, 'PVA': 250, 'MARBLE': 250, 'WOOD': 250, 'PETG': 235, 'PET': 235, 'ABS': 280, 'ASA': 280, 'HIPS': 280, 'PA': 280, 'PC': 300, 'TPU': 250, 'TPE': 250}
gcode:
  {% if params.CLASS is defined %}
    _TIP_SHAPE_MOVES CLASS={params.CLASS} REPORT_ID={params.REPORT_ID|default('')}
  {% else %}
    {% set phys = printer.toolhead.extruder %}
    {% set phys_idx = 0 %}
    {% if phys != 'extruder' %}{% set phys_idx = phys[8:]|int %}{% endif %}
    # Materials are per logical slot; find the slot mapped to this physical tool.
    {% set sv = printer.save_variables.variables %}
    {% set owners = [phys_idx] %}
    {% for i in range(4) %}
        {% if sv['box_modify_t%d' % i]|default(i)|int == phys_idx %}{% set _ = owners.append(i) %}{% endif %}
    {% endfor %}
    {% set slot = params.T|default(owners[-1])|int %}
    {% set cls = 'pla' %}{% set src = 'default' %}{% set mat = '' %}
    {% if params.MATERIAL is defined %}
        {% set mat = params.MATERIAL|string %}{% set src = 'param' %}
    {% elif 'wm_material' in printer and printer.wm_material.available %}
        {% set mat = printer.wm_material['material%d' % slot] %}{% set src = 'wm_material' %}
    {% endif %}
    {% if mat != '' and mat != 'Unknown' %}
        {% set m = mat|upper %}
        {% if m.startswith('TPU') or m.startswith('TPE') %}{% set cls = 'soft' %}
        {% elif m.startswith('PETG') or m.startswith('PCTG') or m == 'PET' %}{% set cls = 'petg' %}
        {% elif m.startswith('ABS') or m.startswith('ASA') or m.startswith('HIPS') or m == 'WOOD' %}{% set cls = 'abs' %}
        {% endif %}
    {% else %}
        {% set t = printer[phys].target|float %}
        {% set src = 'temp %d' % t %}
        {% if t >= 225 and t <= 235 %}{% set cls = 'soft' %}
        {% elif t >= 255 %}{% set cls = 'abs' %}
        {% endif %}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_TIP_SHAPE_RETRACT VARIABLE=result VALUE='"{cls}"'
    SET_GCODE_VARIABLE MACRO=_TIP_SHAPE_RETRACT VARIABLE=source VALUE='"{src}"'
    SET_GCODE_VARIABLE MACRO=_TIP_SHAPE_RETRACT VARIABLE=material VALUE='"{mat}"'
    SET_GCODE_VARIABLE MACRO=_TIP_SHAPE_RETRACT VARIABLE=slot VALUE={slot}
    {% set label = src %}
    {% if mat != '' %}{% set label = src ~ ' ' ~ mat %}{% endif %}
    RESPOND MSG="Unload: using the {cls} tip-shaping sequence for slot T{slot} ({label})"
    {% set boost = unload_temp_min|float %}
    {% if mat != '' %}
        {% set key = (mat|upper).split(' ')[0] %}
        {% if key in unload_temps %}{% set boost = unload_temps[key]|float %}{% endif %}
    {% elif cls == 'abs' %}
        {% set boost = [boost, 280]|max %}
    {% endif %}
    {% if unload_temp_min|float <= 0 %}{% set boost = 0 %}{% endif %}
    {% set boost = params.TEMP_MIN|default(boost)|float %}
    {% set boost = [boost, printer.configfile.settings[phys].max_temp|float - 5]|min %}
    # Vendor M109/M104 default a missing T to T0; T is a logical slot.
    {% if boost > 0 and (printer[phys].target|float - boost)|abs > 1 %}
    RESPOND MSG="Unload temperature for {phys} (slot T{slot}): {boost|int} C, screen target was {printer[phys].target|int} C"
    {% if params.DRY_RUN is not defined %}
    M109 S{boost|int} T{slot}
    {% endif %}
    {% endif %}
    {% if params.DRY_RUN is not defined %}
    _TIP_SHAPE_MOVES CLASS={cls} REPORT_ID={params.REPORT_ID|default('')}
    {% endif %}
  {% endif %}

# E moves only. CLASS is a parameter: a caller's Jinja renders before its
# sub-macros run, so it cannot read a variable set by _TIP_SHAPE_RETRACT.

[gcode_macro _TIP_SHAPE_MOVES]
# petg cooling moves (Prusa: 3 at 5 -> 2.5 mm/s) and stamping distance
# (Prusa 45 mm; 35 here so the stub stops 5 mm short of the start).
variable_cooling_moves: 3
variable_cooling_len: 10
variable_cooling_speed_list: [300, 240, 150]
variable_stamp_len: 35
gcode:
    {% set cls = params.CLASS|default('pla')|lower %}
    {% set report_id = params.REPORT_ID|default('') %}
    {% if report_id %}
    _WMP_TIP_PHASE_REPORT ID={report_id} CLASS={cls} SEQ=0 PHASE=starting KNOWN=0 FORWARD=0 REVERSE=0 PENDING=1
    {% endif %}
    M83
    G92 E0
    {% if cls == 'soft' %}
    G1 E5 F600      ; small purge
    M400
    {% if report_id %}
    _WMP_TIP_PHASE_REPORT ID={report_id} CLASS={cls} SEQ=1 PHASE=before_final_pull KNOWN=1 FORWARD=5 REVERSE=0 PENDING=1
    {% endif %}
    {% if 'openace' in printer %}_OPENACE_ROLLBACK_ASSIST_ON{% endif %}
    G1 E-27 F2700   ; fast pull out of the melt zone
    G1 E-5.5 F40    ; very slow pull draws the cone
    G1 E-29.5 F1500 ; final extraction (U1: -37.5 + feeder; ours: net -57)
    {% elif cls == 'petg' %}
    ; Prusa PrusaResearch.ini *PETPG* recipe. U1-style slow pulls draw
    ; PETG into a long strand.
    G1 E15 F400     ; purge slow: fresh melt
    G1 E25 F1050    ; ram, 17.5 mm/s (Prusa). Skips a few steps here; see final pull
    M400
    {% if report_id %}
    _WMP_TIP_PHASE_REPORT ID={report_id} CLASS={cls} SEQ=1 PHASE=before_final_pull KNOWN=1 FORWARD=40 REVERSE=0 PENDING=1
    {% endif %}
    {% if 'openace' in printer %}_OPENACE_ROLLBACK_ASSIST_ON{% endif %}
    G1 E-40 F3600   ; single fast pull at 60 mm/s (Prusa), no slow phase
    {% for i in range(cooling_moves) %}
    G1 E{cooling_len} F{cooling_speed_list[i % (cooling_speed_list|length)]}
    G1 E-{cooling_len} F{cooling_speed_list[i % (cooling_speed_list|length)]}
    {% endfor %}
    G1 E{stamp_len} F1590   ; stamping: push the stub back at 26.5 mm/s
    G1 E-{stamp_len} F3600  ; and pull again
    G1 E-27 F1500   ; final extraction: net -27; 67 mm withdrawal after the 40 mm ram
    {% elif cls == 'abs' %}
    G1 E20 F400     ; purge slow: fresh, uniform melt in the nozzle
    G1 E10 F1500    ; purge fast
    G1 E-35 F3000   ; fast pull out of the melt zone
    G1 E-5 F50      ; very slow pull: draws the molten tail into a thin cone
    G1 E25 F400     ; re-plunge (slower for ABS): re-melt and round off the tip
    G1 E15 F900
    M400
    {% if report_id %}
    _WMP_TIP_PHASE_REPORT ID={report_id} CLASS={cls} SEQ=1 PHASE=before_final_pull KNOWN=1 FORWARD=70 REVERSE=40 PENDING=1
    {% endif %}
    {% if 'openace' in printer %}_OPENACE_ROLLBACK_ASSIST_ON{% endif %}
    G1 E-35 F3300   ; second fast pull
    G1 E-5 F50      ; second slow pull, finishes the cone
    G1 E-47 F1500   ; final extraction (U1: -30 + feeder; ours: net -57 = stock)
    {% else %}
    G1 E20 F400     ; purge slow: fresh, uniform melt in the nozzle
    G1 E10 F1500    ; purge fast
    G1 E-35 F3000   ; fast pull out of the melt zone
    G1 E-5 F50      ; very slow pull: draws the molten tail into a thin cone
    G1 E25 F1000    ; re-plunge: re-melt and round off the tip
    G1 E15 F1500
    M400
    {% if report_id %}
    _WMP_TIP_PHASE_REPORT ID={report_id} CLASS={cls} SEQ=1 PHASE=before_final_pull KNOWN=1 FORWARD=70 REVERSE=40 PENDING=1
    {% endif %}
    {% if 'openace' in printer %}_OPENACE_ROLLBACK_ASSIST_ON{% endif %}
    G1 E-35 F3300   ; second fast pull
    G1 E-5 F25      ; second slow pull, finishes the cone
    G1 E-100 F1500  ; final extraction: net -110, with extra travel to clear the gears
    {% endif %}
    M400
    {% if report_id %}
    {% set forward = 5 if cls == 'soft' else (40 + (range(cooling_moves)|length)*cooling_len + stamp_len if cls == 'petg' else 70) %}
    {% set reverse = 62 if cls == 'soft' else (67 + (range(cooling_moves)|length)*cooling_len + stamp_len if cls == 'petg' else (127 if cls == 'abs' else 180)) %}
    _WMP_TIP_PHASE_REPORT ID={report_id} CLASS={cls} SEQ=2 PHASE=done KNOWN=1 FORWARD={forward} REVERSE={reverse} PENDING=0
    {% endif %}
    {% if 'openace' in printer %}_OPENACE_ROLLBACK_ASSIST_OFF{% endif %}

# Runs at command dispatch after M400, not during its parent's eager Jinja render.
# No motion, callback or persistence. Non-openACE callers need no report.

[gcode_macro _WMP_TIP_PHASE_REPORT]
gcode:
    {% set known = params.KNOWN|int == 1 %}
    {% set forward = params.FORWARD|float %}
    {% set reverse = params.REVERSE|float %}
    {% set report = {'version': 1, 'invocation': params.ID, 'recipe': params.CLASS,
                     'sequence': params.SEQ|int, 'phase': params.PHASE,
                     'completed_forward_mm': forward if known else None,
                     'completed_reverse_mm': reverse if known else None,
                     'completed_e_mm': forward-reverse if known else None,
                     'prefix_barrier_ok': known, 'pending_suffix': params.PENDING|int == 1} %}
    SET_GCODE_VARIABLE MACRO=_TIP_SHAPE_RETRACT VARIABLE=openace_phase_report VALUE="{report}"

[gcode_macro RETRACT_FILAMENT]
description: Deliberate managed unload on the currently selected physical extruder.
gcode:
    {% set active = printer.toolhead.extruder %}
    {% set head = ['extruder', 'extruder1', 'extruder2', 'extruder3'].index(active) if active in ['extruder', 'extruder1', 'extruder2', 'extruder3'] else -1 %}
    {% if 'wm_material' not in printer or 'openace' in printer or 'AFC' in printer or head < 0 %}
        { action_raise_error('Legacy filament service requires a current standalone physical head') }
    {% endif %}
    {% for key in params %}
        {% if key not in ['T', 'ID'] %}
            { action_raise_error('Unsupported filament service parameter: %s' % key) }
        {% endif %}
    {% endfor %}
    {% if 'T' in params %}
        { action_raise_error('RETRACT_FILAMENT uses the active head; use UNLOAD_FILAMENT T=0..3 to select a physical head') }
    {% endif %}
    WMP_FILAMENT_SERVICE ACTION=unload HEAD={head} {% if 'ID' in params %}ID={params.ID}{% endif %}

# <<< wondermaker+ end: u1-tip-shaping (stock: G1 E3 F600 / E-20 F3500 / G4 P5000 / E10 F1000 / E-50 F1000)

[gcode_macro LOAD_FILAMENT]
description: Managed load; HEAD and legacy T identify a physical head.
gcode:
    {% set head = params.HEAD|default(params.T|default('0')) %}
    {% if head not in ['0', '1', '2', '3'] or ('HEAD' in params and 'T' in params and params.HEAD != params.T) %}
        { action_raise_error('Choose one physical HEAD=0..3 (legacy T is also physical)') }
    {% endif %}
    {% for key in params %}
        {% if key not in ['HEAD', 'T', 'ID'] %}
            { action_raise_error('Unsupported filament service parameter: %s' % key) }
        {% endif %}
    {% endfor %}
    {% if 'T' in params and ('openace' in printer or 'AFC' in printer) %}
        { action_raise_error('Legacy T service requires standalone ownership; use the owner controls') }
    {% endif %}
    {% if 'wm_material' not in printer %}
        { action_raise_error('Managed filament service is unavailable; install the WM+ material helper') }
    {% endif %}
    WMP_FILAMENT_SERVICE ACTION=load HEAD={head} {% if 'ID' in params %}ID={params.ID}{% endif %}
[gcode_macro UNLOAD_FILAMENT]
description: Managed unload; HEAD and legacy T identify a physical head.
gcode:
    {% set head = params.HEAD|default(params.T|default('0')) %}
    {% if head not in ['0', '1', '2', '3'] or ('HEAD' in params and 'T' in params and params.HEAD != params.T) %}
        { action_raise_error('Choose one physical HEAD=0..3 (legacy T is also physical)') }
    {% endif %}
    {% for key in params %}
        {% if key not in ['HEAD', 'T', 'ID'] %}
            { action_raise_error('Unsupported filament service parameter: %s' % key) }
        {% endif %}
    {% endfor %}
    {% if 'T' in params and ('openace' in printer or 'AFC' in printer) %}
        { action_raise_error('Legacy T service requires standalone ownership; use the owner controls') }
    {% endif %}
    {% if 'wm_material' not in printer %}
        { action_raise_error('Managed filament service is unavailable; install the WM+ material helper') }
    {% endif %}
    WMP_FILAMENT_SERVICE ACTION=unload HEAD={head} {% if 'ID' in params %}ID={params.ID}{% endif %}
[gcode_macro M221]
rename_existing:M99221
gcode:
    M99221 S{params.S|int} 
    {% if params.T is defined %}
        SAVE_VARIABLE VARIABLE=t{params.T|int}_flow_extruder VALUE={params.S|int}
    {% endif %}

[gcode_macro RESET_FLOW_EXTRUDER]
# >>> wondermaker+ begin: user-facing-wording-18
# Why: explain the action or next step in plain English.
description: Restore the saved extrusion flow percentage
# <<< wondermaker+ end: user-facing-wording-18
gcode:
    {% set thr_number = printer.save_variables.variables.thr_number|int %}
    {% for i in range(thr_number) %}
        M221 S100 T{i}
    {% endfor %}

[gcode_macro filament_insert_gcode]
description: Retired automatic filament route; use managed filament service.
gcode:
    { action_raise_error('Filament insertion does not start loading; use Load in Filaments') }

[gcode_macro filament_insert]
description: Retired automatic filament route; use managed filament service.
gcode:
    { action_raise_error('Filament insertion does not start extrusion; use Load in Filaments') }
