# >>> wondermaker+ begin: probe-with-initial-tool-controls (ours, 2026-08-30)
[gcode_macro PROBE_WITH_INITIAL_TOOL]
description: Probe with the first printing head: ENABLE=1 on, ENABLE=0 off; saved per printer. No parameter reports the setting.
