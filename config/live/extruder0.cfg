[include wm_zru_thr0.cfg]


[tmc2209 extruder]
uart_pin:T0:PB3
run_current: 0.6
# hold_current: 0.5
interpolate: True
stealthchop_threshold: 0

[verify_heater extruder]
max_error: 200
check_gain_time:30
hysteresis: 10
heating_gain: 2

[heater_fan hotend0_fan]
pin: T0:PB6
heater: extruder
heater_temp: 70.0

[filament_switch_sensor filament0]
pause_on_runout: False                    # 必须改为 False
switch_pin: T0:PC13
event_delay: 0.5
runout_gcode:
    RESPOND MSG="Filament runout detected, pausing in 2.5 seconds..."
    UPDATE_DELAYED_GCODE ID=delayed_pause0 DURATION=2.5

insert_gcode:
    {% set printer_state = printer.print_stats.state %}
    {% set bed_leveling = printer["gcode_macro G29"].bed_leveling|default(False) %}
    {% set idle_state = printer.idle_timeout.state %}
    # >>> wondermaker+ begin: insert-no-autoload (ours, 2026-08-30)
    # Why: the stock auto-load here duplicated the touchscreen's Load flow
    # (purge, dock, undock, purge, dock). Load from the screen only.
    {% if printer_state != "printing" and not (bed_leveling and idle_state == "Printing") %}
        { action_respond_info("Filament detected on T0. Use Load on the screen to feed it.") }
        UPDATE_DELAYED_GCODE ID=delayed_pause0 DURATION=0
    {% endif %}
    # <<< wondermaker+ end: insert-no-autoload (stock: ACTIVATE_EXTRUDER / filament_insert / T0 / M109 / filament_insert_gcode / PARK_CURRENT_TOOL)

[delayed_gcode delayed_pause0]
gcode:
    RESPOND MSG="2.5 seconds completed, pausing now"
    PAUSE

[filament_switch_sensor docked0]
pause_on_runout: False
runout_gcode: 
insert_gcode: 
switch_pin: T0:PB12

[neopixel T0_RGB]
pin: T0:PB9


