[include wm_zru_thr0.cfg]


[tmc2209 extruder]
uart_pin:T0:PB3
run_current: 0.6
# hold_current: 0.5
interpolate: True
stealthchop_threshold: 0

[verify_heater extruder]
max_error: 200
check_gain_time:30
hysteresis: 10
heating_gain: 2

[heater_fan hotend0_fan]
pin: T0:PB6
heater: extruder
heater_temp: 70.0

[filament_switch_sensor filament0]
pause_on_runout: True
switch_pin: T0:PC13
insert_gcode:
    { action_respond_info("After the indicator light is on, continue pushing the filament until you feel it being actively pulled in by the extruder (filament loading must be performed before printing).") }
    {% set extruder_name_back = printer.toolhead.extruder %}
    ACTIVATE_EXTRUDER EXTRUDER=extruder
    SAVE_VARIABLE VARIABLE=if_check_extruder_status value=0
    filament_insert_gcode
    SAVE_VARIABLE VARIABLE=if_check_extruder_status value=1
    ACTIVATE_EXTRUDER EXTRUDER={extruder_name_back}

[filament_switch_sensor docked0]
pause_on_runout: False
runout_gcode: 
insert_gcode: 
switch_pin: T0:PB12

[neopixel T0_RGB]
pin: T0:PB9

