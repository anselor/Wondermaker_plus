[gcode_macro WIPE_NOZZLE_SIMPLE]
gcode:
    {% set current_extruder = printer.toolhead.extruder %}
    {% if current_extruder == "extruder" %}
        {% set targe_temprature = printer.extruder.target %}
        {% set tool = 0 %}
    {% elif current_extruder == "extruder1" %}
        {% set targe_temprature = printer.extruder1.target %}
        {% set tool = 1 %}
    {% elif current_extruder == "extruder2" %}
        {% set targe_temprature = printer.extruder2.target %}
        {% set tool = 2 %}
    {% elif current_extruder == "extruder3" %}
        {% set targe_temprature = printer.extruder3.target %}
        {% set tool = 3 %}
    {% endif %}

    {% set wipe_pos = printer.save_variables.variables.wipe_position|default([-13.0, 240.0]) %}
    {% set wipe_x = wipe_pos[0] %}
    {% set wipe_y = wipe_pos[1] %}
    {% set wipe_y_end = wipe_y + 35 %}

    G90
    G0 Y{wipe_y} F12000
    G0 X{wipe_x} F12000
    
    {% for I in range(1, 5) %}
    G0 Y{wipe_y} F3000
    G0 Y{wipe_y_end} F3000
    {% endfor %}
    G0 Y200 F12000
    G0 X145 F12000
    G0 Y273 F12000 
    SET_KINEMATIC_POSITION Z=320.0
    G4 P1000
    probe  probe_speed=8
    SET_KINEMATIC_POSITION Z=0.0
    G91
    G1 Z0.2 F600
    G90
    {% for I in range(1, 5) %}
    G0 X140 F3000
    G0 X160 F3000
    {% endfor %}
    G91
    G1 Z10
    G90
    G0 Y{wipe_y} F12000
    G0 X{wipe_x} F12000
    {% for I in range(1, 5) %}
    G0 Y{wipe_y} F3000
    G0 Y{wipe_y_end} F3000
    {% endfor %}
    G0 Y200 F12000


[gcode_macro WIPE_NOZZLE]
# >>> wondermaker+ begin: wipe-speed (original tuning, re-applied on 1.1.04 2026-08-19)
# Why: stock wipes strokes at a hardcoded 50 mm/s; comparable machines wipe
# ~3-4x faster with no downside, and slower wiping = more hot-nozzle ooze.
# Tunable; combined with the vendor's 1.1.04 wipe_position variable below.
variable_wipe_speed: 12000  # mm/min for wipe strokes (200 mm/s; stock: 3000)
# <<< wondermaker+ end: wipe-speed
gcode:
    {% if "xy" not in printer.toolhead.homed_axes %}
        G28 X Y
    {% endif %}
    # >>> wondermaker+ begin: wipe-feedrate-restore (original fix, re-applied on 1.1.04 2026-08-19)
    # Why: gcode feedrate is modal; WIPE_NOZZLE ends with wipe strokes and
    # stock never restores the caller's feedrate, so the next travel without an
    # explicit F crawled at wipe speed. Bracket the whole macro's state.
    SAVE_GCODE_STATE NAME=_wmp_wipe
    # <<< wondermaker+ end: wipe-feedrate-restore
    {% set wipe_pos = printer.save_variables.variables.wipe_position|default([-13.0, 240.0]) %}
    {% set wipe_x = wipe_pos[0] %}
    {% set wipe_y = wipe_pos[1] %}
    {% set wipe_y_end = wipe_y + 35 %}
    # >>> wondermaker+ begin: idle-wipe-clearance
    # Calibration/tool changes can wipe before PROBE_CALIBRATE starts. For
    # homed, idle travel apply the same minimum without changing print lifts.
    {% if printer.print_stats.state not in ['printing', 'paused'] and 'xyz' in printer.toolhead.homed_axes %}
        _WMP_CALIBRATION_CLEARANCE
    {% endif %}
    # <<< wondermaker+ end: idle-wipe-clearance
    G90
    G0 Y{wipe_y} F12000
    G0 X{wipe_x} F12000

    {% for I in range(1, 5) %}
        G0 Y{wipe_y} F{wipe_speed}
        G0 Y{wipe_y_end} F{wipe_speed}
    {% endfor %}
    # >>> wondermaker+ begin: wipe-feedrate-restore-exit
    RESTORE_GCODE_STATE NAME=_wmp_wipe
    # <<< wondermaker+ end: wipe-feedrate-restore-exit


[gcode_macro _SAVE_WIPE_POSITION]
gcode:
    {% set position_x, position_y, position_z = printer.custom_hall.last_toolhead_position %}
    {% if position_x == 0 and position_y == 0 %}
        { action_respond_info("RUN GET_T_POSITION FIRST") }
    {% else %}
        SAVE_VARIABLE VARIABLE=wipe_position VALUE={position_x},{position_y}
        { action_respond_info("SAVE WIPE POSITION X:%f Y:%f" % (position_x, position_y)) }
    {% endif %}

[gcode_macro CALIBRATE_WIPE_POSITION]
gcode:
    GET_T_POSITION
    _SAVE_WIPE_POSITION
