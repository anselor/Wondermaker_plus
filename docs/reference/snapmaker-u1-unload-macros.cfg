    {% set nozzle_diameter = printer[printer.toolhead.extruder].nozzle_diameter %}
    {% set nozzle_volume_type = printer[printer.toolhead.extruder].nozzle_volume_type %}
    {% if extruder_index == 0 %}
    {% set nozzle_diameter = printer['extruder'].nozzle_diameter %}
    {% set nozzle_volume_type = printer['extruder'].nozzle_volume_type %}
    {% else %}
    {% set nozzle_diameter = printer['extruder%d' % (extruder_index)].nozzle_diameter %}
    {% set nozzle_volume_type = printer['extruder%d' % (extruder_index)].nozzle_volume_type %}
    {% endif %}
    {% set filament_soft = 0 %}
    {% if printer.print_task_config['filament_soft'][extruder_index] == True %}
    {% set filament_soft = 1 %}
    {% endif %}
    {% set filament_soft = params.SOFT | default(filament_soft) | int %}
    {% set filament_main_type = printer.print_task_config['filament_type'][extruder_index] %}
    {% set filament_sub_type = printer.print_task_config['filament_sub_type'][extruder_index] %}
    
