# Snapmaker U1 unload macros (firmware 1.6.0.267_20260815, pulled 2026-08-29 via Moonraker)
# Reference only — not loaded by the Wondermaker. Source of the u1-tip-shaping change in live/macros.cfg.

[gcode_macro INNER_FILAMENT_UNLOAD]
gcode:
    
    {% set nozzle_diameter = params.NOZZLE_DIAMETER | default(0.4) | float %}
    {% set temp = params.TEMP | default(250) | int %}
    {% set soft = params.SOFT | default(0) | int %}
    
    MOVE_TO_DISCARD_FILAMENT_POSITION
    M109 S{temp}
    CONTROL_RETRACT_ACTION SOFT={soft}
    M400
    M104 S0
    M106 S255
    G4 P5000
    INNER_CUTOFF_BASE_DISCARD
    INNER_ROUGHLY_CLEAN_NOZZLE_BASE_DISCARD ACTION=2
    INNER_DISCARD_FILAMENT_BASE_DISCARD
    M107

[gcode_macro CONTROL_RETRACT_ACTION]
gcode:
    
    {% set only_retract = params.ONLY_RETRACT | default(0) | int %}
    {% set extruder_default = printer[printer.toolhead.extruder].extruder_index %}
