# Included from the fluidd server block by install.sh.
# Everything Wondermaker+ adds to nginx lives here, so uninstalling only has to
# remove the single `include` line it inserted.

location = /wmp-screen {
    return 301 /wmp-screen/;
}

location /wmp-screen/ {
    proxy_pass http://127.0.0.1:8975/;
    proxy_http_version 1.1;

    # MJPEG must not be buffered or the stream arrives in stalled bursts.
    proxy_buffering off;
    postpone_output 0;
    proxy_ignore_headers X-Accel-Buffering;

    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # A static screen sends no frames; don't let nginx time the stream out.
    proxy_read_timeout 86400;
    access_log off;
}
